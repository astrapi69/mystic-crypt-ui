# The three end-to-end suites (e2eTest, e2eLockTest, e2eKdbxTest): the Swing UI tests, each on a display of its own.
# They used to run inside the required job "build" of gradle.yml and made every merge wait 40 minutes. Since the
# maintainer's decision of 2026-11-23 no merge waits for them: they run on every pull request, after every merge and
# every night, and a red run on develop is fixed before anything else, or the pull request that caused it is reverted.
# The release gate runs every suite before a tag: this workflow and gradle.yml, each started by hand with force.

name: UI tests

on:
  pull_request:
    branches: [ master, develop, 'hotfix/**' ]
  push:
    branches: [ develop, 'hotfix/**' ]
  # A manual run is the release gate's end-to-end part in Actions (the maintainer's decision of 2026-11-25), forced by
  # default. Start it with: gh workflow run e2e.yml --ref <ref> -f force=true
  workflow_dispatch:
    inputs:
      force:
        description: 'Release gate: force each suite with --rerun and check the results'
        type: boolean
        default: true
  schedule:
    - cron: '17 2 * * *'

# a newer push to a pull request makes its older run pointless; a run on develop or a hotfix branch, a nightly one
# and one started by hand are never cancelled
concurrency:
  # one group per pull request; every other run has a group of its own, since a newer run of the same group
  # cancels a pending one even without cancel-in-progress (GitHub's concurrency documentation)
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    # each suite has a limit of its own in gradle/testing.gradle (50, 20 and 10 minutes) with a thread dump of every
    # test JVM two minutes before it; the job's limit is above their sum
    timeout-minutes: 90
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Give every step a temporary directory on the runner's work disk
        # TMPDIR for every step and, through gradle/test-jvms.gradle, java.io.tmpdir for every test JVM: a
        # release gate run writes its temporary files on a disk with room (RL-124). The df line says how much
        # room, so a disk that fills up shows in the log of the run it broke
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          df -h "$RUNNER_TEMP" /tmp
      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version-file: '.sdkmanrc'
          distribution: 'temurin'
      - name: Setup Gradle
        # v5.0.2, not v6: from v6 the action bundles a proprietary caching component (the maintainer's decision F2, 2026-11-20).
        # v5.0.2 lies in the range of GHSA-chpw-2mqm-95cc (fixed in 6.4.1), which affects only the two-workflow
        # download-and-submit setup; this workflow submits no dependency graph. Do not switch to download-and-submit.
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Install Xvfb and the e2e harness's tools
        # the same as in gradle.yml: the refresh may fail on a third-party repository of the runner image, the
        # install is the gate (#293); fluxbox, wmctrl, x11-utils and iproute2 are what the own-display plugin's
        # harness needs (#505, #597, #741)
        run: |
          sudo apt-get update || echo "apt-get update reported errors; continuing to the install"
          sudo apt-get install -y xvfb fluxbox wmctrl x11-utils iproute2 openssl
      - name: Install KeePassXC
        # the KDBX round trip of e2eKdbxTest is measured with the program a user opens these files with (#384); a
        # missing keepassxc-cli fails that test rather than skipping it. keepassxc-minimal 2.7.10 wrote the fixture;
        # Ubuntu's keepassxc is the fallback when that package is missing
        run: sudo apt-get install -y keepassxc-minimal || sudo apt-get install -y keepassxc
      - name: Install the de_DE locale
        run: |
          sudo locale-gen de_DE.UTF-8
          locale -a
      - name: Build the plugin zips
        # The end-to-end tests install the plugins from their zips. The plugins' own tests run in gradle.yml, so the
        # zips are built here without them
        run: make plugins PLUGIN_TESTS= PLUGIN_ZIP_TESTS= SCRIPT_TESTS=no
      - name: Run the end-to-end suites
        # --continue: a failure in one suite does not hide the result of the others. A nightly run and a manual run with
        # force (the default) force each suite with --rerun, which binds to the task named before it (#410): the build
        # cache would otherwise restore the last develop run's results and execute nothing
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$EVENT" = schedule ] || [ "$FORCE" = true ]; then
            date -u +%s > "$RUNNER_TEMP/forced-run-started"
            ./gradlew --continue e2eTest --rerun e2eLockTest --rerun e2eKdbxTest --rerun
          else
            ./gradlew --continue e2eTest e2eLockTest e2eKdbxTest
          fi
      - name: Check that the results are from the forced run
        # every result file exists and is not older than the forced run, as in gradle.yml (#630)
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$EVENT" = schedule ] || [ "$FORCE" = true ]; then
            scripts/check-forced-run-results.sh "$(cat "$RUNNER_TEMP/forced-run-started")" \
              build/test-results/e2eTest build/test-results/e2eLockTest build/test-results/e2eKdbxTest
          fi
      - name: Print what was on screen when a UI test failed
        # WhatWasOnScreen writes its report to the test JVM's standard output, which Gradle keeps in the result XML
        # and does not print (#575). Always: a green run prints "0 of N result files carried a report"
        if: always()
        run: >-
          scripts/print-on-screen-reports.sh build/test-results/e2eTest
          build/test-results/e2eLockTest build/test-results/e2eKdbxTest
      - name: Upload the test reports
        # always, not only on failure (#306): a green run whose evidence is discarded cannot be checked afterwards
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-reports
          path: |
            build/reports/tests/e2eTest
            build/test-results/e2eTest
            build/reports/tests/e2eLockTest
            build/test-results/e2eLockTest
            build/reports/tests/e2eKdbxTest
            build/test-results/e2eKdbxTest
            build/own-display
          retention-days: 14
