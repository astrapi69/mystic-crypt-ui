# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Install Xvfb
        # The refresh is the means, the install is the gate. apt-get update exits non-zero when ANY
        # configured repository fails, and the runner image ships third-party repositories this
        # build does not use - Google's served a Packages.gz whose hash did not match its own
        # Release file and took every pull request red with it, on diffs that never reach the
        # compiler. apt's own last word there is "They have been ignored, or old ones used
        # instead", so the refresh must not be what fails the job (#293).
        #
        # Nothing is weakened: xvfb comes from Ubuntu's universe, and if it really cannot be
        # resolved the install below fails and names that, rather than somebody else's mirror.
        run: |
          sudo apt-get update || echo "apt-get update reported errors; continuing to the install"
          sudo apt-get install -y xvfb
      - name: Build the internal plugins
        # The plugins are NOT subprojects of this build - each is its own Gradle build that
        # compiles against the host through mavenLocal(), so `./gradlew build` below never
        # compiles one, never runs one's tests, and never produces a zip.
        #
        # That was measured, not assumed: the run that merged #306 reported
        # "e2eTest: 113 classes, 199 tests, 56 skipped", and the 56 were 43 whole classes -
        # every plugin's end-to-end test - skipping on `assumeTrue(Files.exists(<plugin>.zip))`.
        # Eleven shipped features were verified only by whoever last ran `make plugins` locally.
        #
        # Under xvfb because several plugin unit tests construct Swing components. Measured at
        # 1m24s locally for all thirteen, against a twelve-minute job (#333).
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" make plugins

      - name: Execute Gradle build
        # xvfb-run provides a virtual display so the AssertJ-Swing e2e UI tests really run
        # in CI (without it they would be skipped by their headless assumption)
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" ./gradlew build
        env:
          ossrhUsername: ${{secrets.OSSRHUSERNAME}}
          ossrhPassword: ${{secrets.OSSRHPASSWORD}}
      - name: Upload the test reports
        # a failing UI test prints only its top stack frame to the console; the full trace lives in
        # the xml reports, so keep them when something goes red - otherwise a flaky failure is
        # impossible to diagnose after the fact
        #
        # ALWAYS, not only on failure (#306): a green run whose evidence is discarded cannot be
        # checked afterwards, and "how many tests were those" then has no answer but a local run.
        # Both suites since the split (#319) - uploading only build/test-results/test would keep
        # the fast half and drop the one that takes the time
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
            build/reports/tests/e2eTest
            build/test-results/e2eTest
          retention-days: 14
