# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ master, develop, 'hotfix/**' ]
  pull_request:
    branches: [ master, develop, 'hotfix/**' ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version-file: '.sdkmanrc'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install Xvfb and the e2e harness's tools
        # The refresh is the means, the install is the gate. apt-get update exits non-zero when ANY
        # configured repository fails, and the runner image ships third-party repositories this
        # build does not use - Google's served a Packages.gz whose hash did not match its own
        # Release file and took every pull request red with it, on diffs that never reach the
        # compiler. apt's own last word there is "They have been ignored, or old ones used
        # instead", so the refresh must not be what fails the job (#293).
        #
        # Nothing is weakened: xvfb comes from Ubuntu's universe, and if it really cannot be
        # resolved the install below fails and names that, rather than somebody else's mirror.
        #
        # fluxbox, wmctrl, x11-utils (xdpyinfo) and iproute2 (ss, which names the listener on a
        # display's socket, #597) are what the own-display plugin's harness needs, and since #505 every
        # test task of every build below gets its display from it (astrapi69/own-display-gradle-plugin,
        # #741), so nothing below runs under xvfb-run any more.
        #
        # openssl is what the keygen plugin's ProtectedKeyOpensElsewhereTest opens a password
        # protected key with (openssl pkcs8 -inform DER): the test fails instead of skipping when CI
        # is set and the program is missing, so the runner installs it rather than the test working
        # around it.
        run: |
          sudo apt-get update || echo "apt-get update reported errors; continuing to the install"
          sudo apt-get install -y xvfb fluxbox wmctrl x11-utils iproute2 openssl
      - name: Install KeePassXC
        # the KDBX round trip is measured with the program a user actually opens these files with,
        # not with our own model - a field our model does not carry would otherwise compare equal to
        # itself and the test would pass while the file lost it (#384). A missing keepassxc-cli fails
        # that test rather than skipping it, so it is installed here rather than worked around there.
        # The runner installs keepassxc-minimal, 2.7.10, the version that wrote the fixture (CI runs
        # 44333392266 and 44490633638 print "Setting up keepassxc-minimal (2.7.10+dfsg1-2ubuntu1)").
        # The fallback to Ubuntu's keepassxc, 2.7.6 (CI run 35078636917 had
        # no keepassxc-minimal), applies only when that package is missing. The test names the
        # version it read with in every failure message
        run: sudo apt-get install -y keepassxc-minimal || sudo apt-get install -y keepassxc
      - name: Install the de_DE locale
        # ForkedJvmTest checks that a JVM the tests start takes the German language of a German
        # desktop's environment, which a JVM can only do where the machine has that locale: without
        # it the JDK falls back to en_US, and the test skipped here (CI run 44293104727, #1027). The
        # list printed after it is the evidence of what the runner got
        run: |
          sudo locale-gen de_DE.UTF-8
          locale -a
      - name: Build the internal plugins
        # The plugins are NOT subprojects of this build - each is its own Gradle build that
        # compiles against the host through mavenLocal(), so `./gradlew build` below never
        # compiles one, never runs one's tests, and never produces a zip.
        #
        # That was measured, not assumed: the run that merged #306 reported
        # "e2eTest: 113 classes, 199 tests, 56 skipped", and the 56 were 43 whole classes -
        # every plugin's end-to-end test - skipping on `assumeTrue(Files.exists(<plugin>.zip))`.
        # Eleven shipped features were verified only by whoever last ran `make plugins` locally.
        #
        # Several plugin unit tests construct Swing components. Each plugin build gets its display
        # from the own-display plugin, the way the host does - so no xvfb-run here: the step proves
        # the plugin builds bring their own (#505, #741). Measured at
        # 1m24s locally for all thirteen, against a twelve-minute job (#333).
        run: make plugins

      - name: Read the releases a vault has to stay readable in
        # gradle.properties is the one place the numbers live; the cache key needs them here: the
        # format compatibility release (#402) and the last one with the application's own envelope
        # (#490)
        id: compatibility
        run: |
          echo "version=$(sed -n 's/^formatCompatibilityRelease=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
          echo "envelope=$(sed -n 's/^envelopeMoveRelease=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
      - name: Cache those releases' application jars
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mystic-crypt-ui/release-jars
          key: release-jar-${{ steps.compatibility.outputs.version }}-${{ steps.compatibility.outputs.envelope }}
      - name: Fetch those releases' application jars
        # the installer as users downloaded it, checked against its published sha256, the jar taken
        # out of its pack. VaultOpensInTheLastReleaseTest opens a vault this build writes with it,
        # and fails here in CI when the jar is missing rather than skipping (#402)
        run: make release-jar
      - name: Execute Gradle build
        # No xvfb-run (#505): every test task gets its display from the own-display plugin (#741),
        # the same way it does on a desktop, where an inherited display
        # is the person's screen. The runner has no DISPLAY at all, so a green run here is evidence
        # that the build brings its own - and a build that could not get one fails, it does not let
        # the AssertJ-Swing tests skip on their headless assumption
        run: ./gradlew build
      - name: Check for unused dependencies
        # Reports a declared dependency nothing uses, in the host and in every plugin build that applies the
        # dependency-analysis plugin (gradle/dependency-analysis.gradle, gradle/plugin-dependency-analysis.gradle).
        # It reads the classes the build above compiled, so it runs after it. Report only until the last group of
        # removals is merged (the maintainer's decision of 2026-11-18): no pull request may turn red through it, not
        # even when the analysis itself fails, so the step may fail without failing the job. The pull request that
        # sets the severity to "fail" removes continue-on-error
        continue-on-error: true
        run: make dependency-analysis
      - name: Print what was on screen when a UI test failed
        # WhatWasOnScreen writes its report to the test JVM's standard output, which Gradle keeps
        # in the result XML and does not print: a red run's log showed the stack trace and nothing
        # of what was on screen, and #575 took that for a report that never ran. This puts every
        # "[on-screen]" line of the e2e suites into the log, where a failure is read first.
        # Always, not only on failure: a green run prints "0 of N result files carried a report",
        # which is the evidence that the step reads what the suites wrote
        if: always()
        run: >-
          scripts/print-on-screen-reports.sh build/test-results/e2eTest
          build/test-results/e2eLockTest build/test-results/e2eKdbxTest
      - name: Upload the test reports
        # a failing UI test prints only its top stack frame to the console; the full trace lives in
        # the xml reports, so keep them when something goes red - otherwise a flaky failure is
        # impossible to diagnose after the fact
        #
        # ALWAYS, not only on failure (#306): a green run whose evidence is discarded cannot be
        # checked afterwards, and "how many tests were those" then has no answer but a local run.
        # Both suites since the split (#319) - uploading only build/test-results/test would keep
        # the fast half and drop the one that takes the time. The plugin builds' results too, which
        # `make plugins` writes into each plugin's own build directory: a plugin test that failed
        # once on CI had nothing left to read (#667)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
            build/reports/tests/e2eTest
            build/test-results/e2eTest
            build/reports/tests/e2eLockTest
            build/test-results/e2eLockTest
            build/reports/tests/e2eKdbxTest
            build/test-results/e2eKdbxTest
            build/own-display
            plugins/*/build/test-results
            plugins/*/build/reports/tests
          retention-days: 14
      - name: Upload the pictures of the plugin windows
        # The plugin tests picture their windows on the build's own display, in English and German
        # (#680), so a change to a window can be looked at from the pull request without a local
        # run. Always: a green run's pictures are what a reviewer compares against the drafts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-screenshots
          path: plugins/*/build/screenshots
          if-no-files-found: error
          retention-days: 14
