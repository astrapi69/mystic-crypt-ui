# Submits the dependency graph Gradle resolves to GitHub, so the repository's dependency graph and
# Dependabot see what the application ships (#634). GitHub reads no Gradle build by itself: before
# this, its graph held the workflow actions and a pom.xml deleted long ago, and Dependabot never saw
# a library the application shipped - commons-beanutils 1.9.4 in 8.10 among them (#617).
#
# The host and every plugin build are submitted, each under a snapshot name of its own. 'runtime'
# marks what ships: the host's runtimeClasspath, which the installer packages, and the jars a plugin
# bundles into its zip; everything else - tests, the installer compiler, the build tool - is
# 'development'. A plugin build reports only those bundled jars: what it compiles against is the
# host's, which the host's manifest reports once instead of 14 times over (#637).

name: Dependency submission

on:
  push:
    branches: [ develop, master ]
  # by hand, to submit another branch, a release's dependencies for one
  workflow_dispatch:

permissions:
  contents: write # the dependency submission API

jobs:
  submit:

    runs-on: ubuntu-latest

    env:
      DEPENDENCY_GRAPH_RUNTIME_INCLUDE_CONFIGURATIONS: '^(runtimeClasspath|bundled)$'
      # The graph plugin registers its resolving task once the projects are evaluated, and with
      # configure-on-demand (gradle.properties) the task is not found; measured on 2026-10-28
      RESOLVE: :ForceDependencyResolutionPlugin_resolveAllDependencies -Dorg.gradle.configureondemand=false --no-configuration-cache

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle, generating a graph for every build and submitting them at the end of the job
        # 6.4.1 fixes GHSA-chpw-2mqm-95cc, which concerns the two-workflow download-and-submit
        # setup; this job generates and submits in one place
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          dependency-graph: generate-and-submit
      - name: Resolve the host
        run: GITHUB_DEPENDENCY_GRAPH_JOB_CORRELATOR=dependency-submission-host ./gradlew $RESOLVE
      - name: Publish the host locally, which every plugin build compiles against
        # no graph for this run: it resolves the host a second time
        run: GITHUB_DEPENDENCY_GRAPH_ENABLED=false ./gradlew publishToMavenLocal -x test
      - name: Resolve every plugin build
        env:
          DEPENDENCY_GRAPH_INCLUDE_CONFIGURATIONS: '^bundled$'
        run: |
          for build in plugins/*/build.gradle; do
            plugin="$(basename "$(dirname "$build")")"
            GITHUB_DEPENDENCY_GRAPH_JOB_CORRELATOR="dependency-submission-$plugin" \
              ./gradlew -p "plugins/$plugin" $RESOLVE
          done
