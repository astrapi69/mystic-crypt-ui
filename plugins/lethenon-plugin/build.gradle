plugins {
    id 'java'
}

group = 'io.github.astrapi69'
version = '1.0.0'

java {
    toolchain {
        // must match the host: its classes are compiled for JDK 25 (class file major 69),
        // which a lower toolchain's javac cannot read from the compile classpath
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    // lethenon is a snapshot until its first release, and the Central snapshot repository is where
    // its publish workflow puts it (lethenon#30). The host carries the same URL since #451
    maven {
        url = "https://central.sonatype.com/repository/maven-snapshots/"
        mavenContent {
            snapshotsOnly()
        }
    }
}

// the host version comes from the root gradle.properties, the one hand-edited version field in
// this repository - never repeated as a literal here, so a release cannot leave it pointing at a
// snapshot that no longer exists (#217)
def hostVersion = new Properties().with { properties ->
    file("../../gradle.properties").withInputStream { properties.load(it) }
    properties.getProperty("projectVersion")
}

// The one library the host does NOT carry. Every other plugin here is compileOnly against
// libraries the application already ships; the chain is not one of them, so this plugin brings it
// in its own zip under lib/, which is where pf4j's DefaultPluginClasspath looks for jars. Only
// lethenon itself: its own dependencies - mystic-crypt, crypt-api, crypt-data, picocli - are on the
// host's runtime classpath already, and shipping a second copy of those is how two versions of one
// class end up in one JVM
configurations {
    bundled {
        transitive = false
        canBeResolved = true
    }
}

dependencies {
    compileOnly "io.github.astrapi69:mystic-crypt-ui:$hostVersion"
    compileOnly libs.mystic.crypt
    // Replay.verify, CanonicalEncoding.readChain, ChainRejected - the chain logic itself, never
    // reimplemented here (architecture.md: the plugin is UI over library calls)
    compileOnly libs.lethenon
    bundled libs.lethenon
    // ResourceBundleExtensions.getStringQuietly - label and tooltip text from
    // lethenon/messages.properties falls back to a literal default rather than throwing when a key
    // is missing, the same way the host's own Messages class behaves (.claude/rules/i18n.md)
    compileOnly "io.github.astrapi69:resourcebundle-core:6.0"
    // JComponentFactory, FrameMode and JInternalFrameExtensions open the tool window; the host
    // carries all three at runtime, like every other plugin here
    compileOnly "io.github.astrapi69:swing-base-components:5.1"
    compileOnly "io.github.astrapi69:swing-components:9"
    // the tool window binds every component to its panel model, the host carries both at runtime
    compileOnly "io.github.astrapi69:swing-model-components:1.2"
    compileOnly "io.github.astrapi69:model-data:3.2.1"
    // the shared tool window layout comes from the host, which brings MigLayout with it
    compileOnly "com.miglayout:miglayout-swing:11.4.3"

    compileOnly "org.pf4j:pf4j:3.15.0"
    // required so the @Extension annotation processor runs and writes META-INF/extensions.idx
    annotationProcessor "org.pf4j:pf4j:3.15.0"

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    // the tests replay real chains, so the chain library is a test dependency rather than only a
    // compile-time one
    testImplementation libs.lethenon
    // the contribution classes implement the host's extension points, so the host jar has to be on
    // the test classpath to load them - for the main sources they stay compileOnly
    testImplementation "io.github.astrapi69:mystic-crypt-ui:$hostVersion"
    testImplementation "com.miglayout:miglayout-swing:11.4.3"
    testImplementation "org.pf4j:pf4j:3.15.0"
    testImplementation "io.github.astrapi69:resourcebundle-core:6.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

// packages the plugin the way the host's DefaultPluginManager expects: plugin.properties at the
// root, compiled classes under classes/, and the one library the host does not carry under lib/
tasks.register('pluginZip', Zip) {
    archiveFileName = "lethenon-plugin-${version}.zip"
    destinationDirectory = layout.buildDirectory.dir("plugin-dist")
    from("src/main/resources") {
        include "plugin.properties"
    }
    into("classes") {
        from sourceSets.main.output.classesDirs
        from("src/main/resources") {
            exclude "plugin.properties"
        }
    }
    into("lib") {
        from configurations.bundled
    }
    dependsOn classes
}
