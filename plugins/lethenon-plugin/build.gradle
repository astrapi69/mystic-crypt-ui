plugins {
    id 'java'
}

group = 'io.github.astrapi69'
version = '1.0.0'

java {
    toolchain {
        // must match the host: its classes are compiled for JDK 25 (class file major 69),
        // which a lower toolchain's javac cannot read from the compile classpath
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Maven Central, and from the local repository the host - or, with -PuseMavenLocal, a family library
// candidate too (#475, #508)
apply from: '../../gradle/plugin-repositories.gradle'
repositories {
    // lethenon is a snapshot until its first release, and the Central snapshot repository is where
    // its publish workflow puts it (lethenon#30). The host carries the same URL since #451
    maven {
        url = "https://central.sonatype.com/repository/maven-snapshots/"
        mavenContent {
            snapshotsOnly()
        }
    }
}

// A snapshot is a changing module, and Gradle trusts its cached copy of one for 24 hours unless told
// otherwise. CI restores the Gradle home from the Actions cache, so it built against a lethenon
// snapshot from before the one on Central and could not find classes the code uses (#464). lethenon
// WAS the only changing module this build fetched from a remote repository; since lethenon 0.1.0
// it fetches a release, so this applies to nothing today and stays as the guard for the next
// snapshot. The host snapshot comes from mavenLocal, which Gradle does not cache.
configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

// the host version comes from the root gradle.properties, the one hand-edited version field in
// this repository - never repeated as a literal here, so a release cannot leave it pointing at a
// snapshot that no longer exists (#217)
def hostVersion = new Properties().with { properties ->
    file("../../gradle.properties").withInputStream { properties.load(it) }
    properties.getProperty("projectVersion")
}

// The libraries the host does NOT carry. Every other plugin here is compileOnly against libraries
// the application already ships; the chain is not one of them, so this plugin brings it in its own
// zip under lib/, which is where pf4j's DefaultPluginClasspath looks for jars. Only lethenon and the
// SQLite driver it keeps the chain in since 0.6.0 (#581): its other dependencies - mystic-crypt,
// crypt-api, crypt-data, picocli - are on the host's runtime classpath already, and shipping a
// second copy of those is how two versions of one class end up in one JVM. The driver is resolved
// as lethenon's own dependency, so its version is the one lethenon declares and no second literal
// here can drift from it. Its jar holds the native library for Linux, macOS and Windows, each on
// x86_64 and aarch64
configurations {
    bundled {
        canBeResolved = true
    }
}

def bundledModules = ['lethenon', 'sqlite-jdbc']
def bundledJars = configurations.bundled.incoming.artifactView {
    componentFilter { id -> id instanceof ModuleComponentIdentifier && id.module in bundledModules }
}.files

dependencies {
    compileOnly "io.github.astrapi69:mystic-crypt-ui:$hostVersion"
    compileOnly libs.mystic.crypt
    // Replay.verify, CanonicalEncoding.readChain, ChainRejected - the chain logic itself, never
    // reimplemented here (architecture.md: the plugin is UI over library calls)
    compileOnly libs.lethenon
    bundled libs.lethenon
    // ResourceBundleExtensions.getStringQuietly - label and tooltip text from
    // lethenon/messages.properties falls back to a literal default rather than throwing when a key
    // is missing, the same way the host's own Messages class behaves (.claude/rules/i18n.md)
    compileOnly libs.resourcebundle.core
    // JComponentFactory, FrameMode and JInternalFrameExtensions open the tool window; the host
    // carries all three at runtime, like every other plugin here
    compileOnly libs.swing.base.components
    compileOnly libs.swing.components
    // GenericTableModel under the chain view's block table; the host carries it at runtime
    compileOnly libs.swing.table.components
    // BrowserControlExtensions opens a launch document of "Before you start" in the browser (#540);
    // the host carries menu-action at runtime
    compileOnly libs.menu.action
    // the tool window binds every component to its panel model, the host carries both at runtime
    compileOnly libs.swing.model.components
    compileOnly libs.model.data
    // the shared tool window layout comes from the host, which brings MigLayout with it
    compileOnly libs.miglayout.swing

    compileOnly libs.pf4j
    // required so the @Extension annotation processor runs and writes META-INF/extensions.idx
    annotationProcessor libs.pf4j

    testImplementation libs.junit.jupiter
    // the tests replay real chains, so the chain library is a test dependency rather than only a
    // compile-time one
    testImplementation libs.lethenon
    // the contribution classes implement the host's extension points, so the host jar has to be on
    // the test classpath to load them - for the main sources they stay compileOnly
    testImplementation "io.github.astrapi69:mystic-crypt-ui:$hostVersion"
    testImplementation libs.miglayout.swing
    testImplementation libs.pf4j
    testImplementation libs.resourcebundle.core
    testImplementation libs.swing.table.components
    testImplementation libs.menu.action
    testRuntimeOnly libs.junit.platform.launcher
}

test {
    useJUnitPlatform()
}


// the tests run on a display of the build's own, not on the one the build was started from (#505)
apply from: '../../gradle/own-display.gradle'

// The licences of the libraries this zip bundles, taken out of the very jars it bundles so that they
// cannot drift from them, next to NOTICE.txt, which names each library and where its licence is:
// sqlite-jdbc is under the Apache License 2.0 and contains code under the Zentus licence, which asks
// for its notice in every binary distribution; lethenon is under the MIT License; SQLite itself is
// in the public domain. The zip carries them under legal/, and the installer installs the same
// directory (#581)
def bundledJar = { String module -> bundledJars.filter { it.name.startsWith("${module}-") } }
tasks.register('pluginLegal', Sync) {
    into layout.buildDirectory.dir('legal')
    from('src/main/legal')
    from({ zipTree(bundledJar('sqlite-jdbc').singleFile) }) {
        include 'META-INF/maven/org.xerial/sqlite-jdbc/LICENSE*'
        eachFile { it.path = "sqlite-jdbc/${it.name}" }
        includeEmptyDirs = false
    }
    from({ zipTree(bundledJar('lethenon').singleFile) }) {
        include 'LICENSE.txt'
        eachFile { it.path = "lethenon/${it.name}" }
        includeEmptyDirs = false
    }
}

// packages the plugin the way the host's DefaultPluginManager expects: plugin.properties at the
// root, compiled classes under classes/, the libraries the host does not carry under lib/, and
// their licences under legal/
tasks.register('pluginZip', Zip) {
    archiveFileName = "lethenon-plugin-${version}.zip"
    destinationDirectory = layout.buildDirectory.dir("plugin-dist")
    from("src/main/resources") {
        include "plugin.properties"
    }
    into("classes") {
        from sourceSets.main.output.classesDirs
        from("src/main/resources") {
            exclude "plugin.properties"
        }
    }
    into("lib") {
        from bundledJars
    }
    into("legal") {
        from tasks.named('pluginLegal')
    }
    dependsOn classes
}

// the plugin started from its zip, the way the installed application starts it (#581): a class path
// with the host and nothing of the plugin's own, so that a library the zip does not carry fails here
// instead of being found on the build's class path, as it is in the end-to-end suite
sourceSets {
    zipTest {
        java.srcDir 'src/zipTest/java'
    }
}

dependencies {
    zipTestImplementation "io.github.astrapi69:mystic-crypt-ui:$hostVersion"
    zipTestImplementation libs.pf4j
    zipTestImplementation libs.junit.jupiter
    zipTestRuntimeOnly libs.junit.platform.launcher
}

configurations.zipTestRuntimeClasspath {
    // the host does not depend on either today; should it ever, this test must still not see them
    exclude group: 'io.github.astrapi69', module: 'lethenon'
    exclude group: 'org.xerial', module: 'sqlite-jdbc'
}

def pluginZipFile = tasks.named('pluginZip').flatMap { it.archiveFile }

tasks.register('zipTest', Test) {
    description = 'Starts the plugin from its zip in a JVM without lethenon and sqlite-jdbc (#581).'
    group = 'verification'
    testClassesDirs = sourceSets.zipTest.output.classesDirs
    classpath = sourceSets.zipTest.runtimeClasspath
    useJUnitPlatform()
    // sqlite-jdbc loads its native library with System::load; the host jar's manifest enables native
    // access for the installed application (gradle/packaging.gradle), this flag does it for the test
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    // no window is opened here, so the test runs on no display and needs no Xvfb, which is what lets
    // it run on macOS and Windows as well (gradle/own-display.gradle)
    systemProperty 'java.awt.headless', 'true'
    inputs.file(pluginZipFile).withPropertyName('pluginZip')
    systemProperty 'lethenon.plugin.zip', pluginZipFile.get().asFile.absolutePath
    dependsOn 'pluginZip'
}

tasks.named('check') {
    dependsOn 'zipTest'
}
