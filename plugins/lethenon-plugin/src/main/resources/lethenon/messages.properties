# The Lethenon plugin's own text. A plugin brings its own everything, including its strings
# (.claude/rules/i18n.md), and every lookup in LethenonMessages carries a literal default, so a
# missing key shows that default instead of throwing out of a panel constructor.
lethenon.tooltip.chain.file=the chain file to replay, written by lethenon's own command line
lethenon.tooltip.browse.chain.file=pick the chain file
lethenon.tooltip.verify=replay the chain from its genesis block: every signature, every state transition, every block hash
lethenon.tooltip.report=what the replay checked, and what it refused
lethenon.label.chain.file=Chain file:
lethenon.label.report=Report:
lethenon.button.verify=Verify the chain
lethenon.menu.name=Lethenon
lethenon.menu.item.verify=Verify a Chain
lethenon.result.accepted=the chain was accepted
lethenon.result.refused=the chain was refused
