# lethenon 0.4.0 (#544, #535): a genesis block pays the burn account, and the main chain starts
# only from the genesis block the library fixes in its code, from lethenon 1.0.0 on
lethenon.chain.kind.later=it starts with lethenon 1.0.0
# lethenon 0.6.0 keeps the chain in a database (#581): a chain file of 0.5.0 or earlier is converted
# only once the person agreed to it; {path}, {file} and {legacy} are replaced, not MessageFormat
lethenon.convert.title=Convert the chain file?
lethenon.convert.message={path} was written by lethenon 0.5.0 or earlier, as mystic-crypt-ui 8.9 and earlier write chain files. lethenon 0.6.0 keeps the chain in a database and reads this file only once it is converted, which happens once:\n\n- the chain in the file was verified, and is converted as it is\n- the file as it is now stays beside it as {legacy}\n- mystic-crypt-ui 8.9 and earlier cannot read {file} after that; they can still read {legacy}\n\nConvert it now?
lethenon.convert.button.convert=Convert
lethenon.convert.button.cancel=Cancel
lethenon.result.not.converted=nothing was done: the chain file was not converted, and this version reads it only converted
lethenon.settings.description.chain.file=the chain file every window starts with; remembered once a window read or wrote it, empty for none
lethenon.settings.description.wallet.file=the wallet file the windows start with; remembered once a window opened it with its password, which is never remembered
lethenon.settings.description.node=the node, host:port, a sync took the chain from; empty for the test network's seed nodes
lethenon.settings.description.proxy=the SOCKS proxy, host:port, a sync went through, for Tor usually 127.0.0.1:9050

