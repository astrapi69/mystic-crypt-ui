lethenon.convert.title=Kettendatei umwandeln?
lethenon.convert.message={path} wurde von lethenon 0.5.0 oder früher geschrieben, so wie mystic-crypt-ui 8.9 und früher Kettendateien schreiben. lethenon 0.6.0 hält die Kette in einer Datenbank und liest diese Datei erst, wenn sie umgewandelt ist, und das geschieht einmal:\n\n- die Kette in der Datei wurde geprüft und wird umgewandelt, wie sie ist\n- die Datei bleibt, wie sie jetzt ist, daneben als {legacy} erhalten\n- mystic-crypt-ui 8.9 und früher können {file} danach nicht mehr lesen; {legacy} können sie weiterhin lesen\n\nJetzt umwandeln?
