# The Lethenon plugin's German text, UTF-8. Translated so far: the view "Before you start" (#540),
# the seed nodes of the sync (#573), the question before a chain file is converted (#581), the
# descriptions of the plugin's settings (#605), and the windows that answer in fields (#604): "Show
# a Balance", "Mine a Pun" and "Send", with what every window asks for and the password
# messages; every
# other key falls back to messages.properties. A key here that messages.properties does not have is
# a translation of nothing (LethenonGermanTextTest).
