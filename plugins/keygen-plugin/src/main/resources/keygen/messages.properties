# Messages for the keygen plugin
keygen.tooltip.algorithm=the key pair algorithm - picks which downstream features (the hex encrypt/decrypt demo, saving a certificate) are even available
keygen.tooltip.curve=the curve an EC key sits on - a certificate or a wallet usually requires one particular one
keygen.tooltip.key.format=the private key encoding - PKCS#8 works for every algorithm, PKCS#1 is only available for RSA and EC
keygen.tooltip.save.format=the encoding every file this window saves is written in - PEM is text, DER is binary
keygen.tooltip.key.size=the RSA key size - disabled for every other algorithm, which already has a fixed size
keygen.tooltip.generate.button=generates a new key pair with the algorithm and options chosen above
keygen.tooltip.clear.button=clears the generated key pair and resets the choices to the configured defaults
keygen.tooltip.save.private.key.button=writes the generated private key to a file, in the format and encoding chosen above
keygen.tooltip.save.private.key.with.password.button=writes the generated private key to a file, encrypted with a password you enter next
keygen.tooltip.save.public.key.button=writes the generated public key to a file, in the encoding chosen above
keygen.tooltip.save.certificate.button=creates and writes a self-signed certificate for the generated key pair - RSA only
keygen.tooltip.password=the password the private key file is encrypted with
keygen.tooltip.repeat.password=repeat the password to catch a typo before the key is written
