plugins {
    id 'java'
}

group = 'io.github.astrapi69'
version = '1.0.0'

java {
    toolchain {
        // must match the host: its classes are compiled for JDK 25 (class file major 69),
        // which a lower toolchain's javac cannot read from the compile classpath
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

// compileOnly against the host jar and every library the moved key-generation panels reference.
// Key generation is the most coupled of the internal plugins: besides EnDecryptPanel (kept in the
// host, shared with the private-key viewer) it reaches host-internal classes - the hex
// key encryptor/decryptor and the whole certificate-wizard subsystem it can launch - all provided
// by the host classloader at runtime through the host jar dependency.
dependencies {
    compileOnly "io.github.astrapi69:mystic-crypt-ui:8.1"
    // PrivateKeyHexDecryptor / PublicKeyHexEncryptor live in the mystic-crypt library, not the host
    compileOnly "io.github.astrapi69:mystic-crypt:11.0.0"
    compileOnly "io.github.astrapi69:crypt-api:10.1"
    compileOnly "io.github.astrapi69:crypt-data:11.1"
    compileOnly "io.github.astrapi69:model-data:3.2.1"
    compileOnly "io.github.astrapi69:swing-base-components:5.1"
    compileOnly "io.github.astrapi69:swing-components:9"
    // Pair (used by the host EnDecryptPanel this plugin's GenerateKeysPanel embeds)
    compileOnly "io.github.astrapi69:silly-bean:3.0"
    compileOnly "io.github.astrapi69:menu-action:5.1"
    compileOnly "com.miglayout:miglayout-swing:11.4.3"
    compileOnly "org.projectlombok:lombok:1.18.46"
    annotationProcessor "org.projectlombok:lombok:1.18.46"

    compileOnly "org.pf4j:pf4j:3.15.0"
    // required so the @Extension annotation processor runs and writes META-INF/extensions.idx
    annotationProcessor "org.pf4j:pf4j:3.15.0"

    // the round-trip test drives the key generation + hex encrypt/decrypt library calls headlessly
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testImplementation "io.github.astrapi69:mystic-crypt:11.0.0"
    testImplementation "io.github.astrapi69:crypt-api:10.1"
    testImplementation "io.github.astrapi69:crypt-data:11.1"
    testImplementation "org.bouncycastle:bcpkix-jdk18on:1.85"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

// packages the plugin the way the host's DefaultPluginManager expects: plugin.properties at the
// root, compiled classes under classes/
tasks.register('pluginZip', Zip) {
    archiveFileName = "keygen-plugin-${version}.zip"
    destinationDirectory = layout.buildDirectory.dir("plugin-dist")
    from("src/main/resources") {
        include "plugin.properties"
    }
    into("classes") {
        from sourceSets.main.output.classesDirs
        from("src/main/resources") {
            exclude "plugin.properties"
        }
    }
    dependsOn classes
}
