rootProject.name = 'keygen-plugin'

// shares the host's version catalog instead of hardcoding a second copy of the mystic-crypt
// version here - this plugin is its own independent Gradle build (no `include` from the root
// settings.gradle), so Gradle's automatic gradle/libs.versions.toml detection does not apply;
// pointing explicitly at the host's file is what makes libs.mystic.crypt resolve here too (#197)
dependencyResolutionManagement {
    versionCatalogs {
        libs {
            from(files("../../gradle/libs.versions.toml"))
        }
    }
}
