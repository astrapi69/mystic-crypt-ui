# Messages for the file-crypt plugin
filecrypt.tooltip.source.file=the file to encrypt or decrypt
filecrypt.tooltip.browse.source.button=choose the file to encrypt or decrypt
filecrypt.tooltip.target.file=the file to write to - left blank, the result is written next to the source file
filecrypt.tooltip.browse.target.button=choose where to write the result
filecrypt.tooltip.file.passphrase=the passphrase that protects the file - required for both encrypting and decrypting
filecrypt.tooltip.file.passphrase.repeated=repeat the passphrase to catch a typo - only checked when encrypting, a wrong passphrase when decrypting is refused by the cipher itself
filecrypt.tooltip.encrypt.file.button=encrypts the file above with the passphrase
filecrypt.tooltip.decrypt.file.button=decrypts the file above with the passphrase
filecrypt.tooltip.plain.text=the text to encrypt, or where the decrypted text appears
filecrypt.tooltip.encrypted.text=the encrypted text, Base64 encoded - paste one in to decrypt it
filecrypt.tooltip.text.passphrase=the passphrase that protects the text - required for both encrypting and decrypting
filecrypt.tooltip.text.passphrase.repeated=repeat the passphrase to catch a typo - only checked when encrypting
filecrypt.tooltip.encrypt.text.button=encrypts the text above with the passphrase
filecrypt.tooltip.decrypt.text.button=decrypts the text above with the passphrase
filecrypt.tooltip.result=what the last operation did
