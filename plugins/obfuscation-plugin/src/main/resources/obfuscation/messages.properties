# Messages for the obfuscation plugin
obfuscation.rule.tooltip.original.char=the character to replace - one character only
obfuscation.rule.tooltip.replace.with=the character it is replaced with - one character only
obfuscation.rule.tooltip.add.button=adds this rule to the table below
obfuscation.operation.rule.tooltip.original.char=the character to replace - one character only
obfuscation.operation.rule.tooltip.replace.with=the character it is replaced with - one character only
obfuscation.operation.rule.tooltip.indexes=comma separated positions in the text where the chosen operation is applied instead of the plain replacement
obfuscation.operation.rule.tooltip.operation=the transformation applied to the original character at the named indexes
obfuscation.operation.rule.tooltip.add.button=adds this rule to the table below
obfuscation.rule.table.tooltip.export.button=saves the rules below to a file, encrypted with the signed-in database's key pair - only works while signed in
obfuscation.rule.table.tooltip.import.button=loads rules from a file, decrypted with the signed-in database's key pair - only works while signed in
obfuscation.rule.table.tooltip.no.key=disabled: this database was opened with a master password only, and rule export and import are protected with the database's key file instead
obfuscation.rule.table.refused.no.key.title=No key file for this database
obfuscation.rule.table.refused.no.key=Export and import of rule files are protected with this database's key file. This database was opened with a master password only, so it has none. Sign in with a database that has a key file to use them.
