plugins {
    id 'java'
}

group = 'io.github.astrapi69'
version = '1.0.0'

java {
    toolchain {
        // must match the host: its classes are compiled for JDK 25 (class file major 69),
        // which a lower toolchain's javac cannot read from the compile classpath
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Maven Central, and from the local repository the host - or, with -PuseMavenLocal, a family library
// candidate too (#475, #508)
apply from: '../../gradle/plugin-repositories.gradle'

// the host version comes from the root gradle.properties, the one hand-edited version field in
// this repository - never repeated as a literal here, so a release cannot leave it pointing at a
// snapshot that no longer exists (#217)
def hostVersion = new Properties().with { properties ->
    file("../../gradle.properties").withInputStream { properties.load(it) }
    properties.getProperty("projectVersion")
}

dependencies {
    compileOnly "io.github.astrapi69:mystic-crypt-ui:$hostVersion"
    // the GnuPG home is read by mystic-crypt's GnuPgHome, with Bouncy Castle's OpenPGP readers and
    // never through the gpg command line; the host ships the library and the module it reads with,
    // so the zip carries neither (docs/decisions/release-key-openpgp-2026-10-29.md, library first)
    compileOnly libs.mystic.crypt
    // ResourceBundleExtensions.getStringQuietly - label and tooltip text from
    // releasekey/messages.properties falls back to a literal default rather than throwing when a key
    // is missing, the same way the host's own Messages class behaves (.claude/rules/i18n.md)
    compileOnly libs.resourcebundle.core
    // JComponentFactory, FrameMode and JInternalFrameExtensions open the tool window; the host
    // carries them at runtime, like every other plugin here
    compileOnly libs.swing.base.components
    compileOnly libs.swing.components
    // the model backed components the panel binds to its model; the host carries both at runtime
    compileOnly libs.swing.model.components
    compileOnly libs.model.data
    // the shared tool window layout comes from the host, which brings MigLayout with it
    compileOnly libs.miglayout.swing

    compileOnly libs.pf4j
    // required so the @Extension annotation processor runs and writes META-INF/extensions.idx
    annotationProcessor libs.pf4j

    // the tests read GnuPG homes that gpg itself wrote, in temporary directories
    testImplementation libs.junit.jupiter
    testImplementation libs.mystic.crypt
    // the contribution classes implement the host's extension points, so the host jar has to be on
    // the test classpath to load them - for the main sources they stay compileOnly
    testImplementation "io.github.astrapi69:mystic-crypt-ui:$hostVersion"
    testImplementation libs.miglayout.swing
    testImplementation libs.pf4j
    testImplementation libs.resourcebundle.core
    testImplementation libs.swing.model.components
    testImplementation libs.model.data
    testImplementation libs.swing.base.components
    testRuntimeOnly libs.junit.platform.launcher
}

test {
    useJUnitPlatform()
}

// the tests run on a display of the build's own, not on the one the build was started from (#505)
apply from: '../../gradle/own-display.gradle'
// the bounds of every test JVM, the same as the host's (#580)
apply from: '../../gradle/test-jvms.gradle'

// packages the plugin the way the host's DefaultPluginManager expects: plugin.properties at the
// root, compiled classes under classes/
tasks.register('pluginZip', Zip) {
    archiveFileName = "release-key-plugin-${version}.zip"
    destinationDirectory = layout.buildDirectory.dir("plugin-dist")
    from("src/main/resources") {
        include "plugin.properties"
    }
    into("classes") {
        from sourceSets.main.output.classesDirs
        from("src/main/resources") {
            exclude "plugin.properties"
        }
    }
    dependsOn classes
}

// the plugin started from its zip, the way the installed application starts it (#581): a class path
// with the host and nothing of the plugin's own, so that a library neither the host nor the zip
// carries fails here instead of being found on the build's class path, as it is in the end-to-end suite
sourceSets {
    zipTest {
        java.srcDir 'src/zipTest/java'
    }
}

dependencies {
    zipTestImplementation "io.github.astrapi69:mystic-crypt-ui:$hostVersion"
    zipTestImplementation libs.pf4j
    zipTestImplementation libs.junit.jupiter
    zipTestRuntimeOnly libs.junit.platform.launcher
}

def pluginZipFile = tasks.named('pluginZip').flatMap { it.archiveFile }

tasks.register('zipTest', Test) {
    description = 'Starts the plugin from its zip in a JVM with the host class path only (#644).'
    group = 'verification'
    testClassesDirs = sourceSets.zipTest.output.classesDirs
    classpath = sourceSets.zipTest.runtimeClasspath
    useJUnitPlatform()
    // no window is opened here, so the test runs on no display and needs no Xvfb
    // (gradle/own-display.gradle)
    systemProperty 'java.awt.headless', 'true'
    inputs.file(pluginZipFile).withPropertyName('pluginZip')
    systemProperty 'release.key.plugin.zip', pluginZipFile.get().asFile.absolutePath
    dependsOn 'pluginZip'
}

tasks.named('check') {
    dependsOn 'zipTest'
}
