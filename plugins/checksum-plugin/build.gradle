plugins {
    id 'java'
}

group = 'io.github.astrapi69'
version = '1.0.0'

java {
    toolchain {
        // must match the host: its classes are compiled for JDK 25 (class file major 69),
        // which a lower toolchain's javac cannot read from the compile classpath
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Maven Central, and from the local repository the host - or, with -PuseMavenLocal, a family library
// candidate too (#475, #508)
apply from: '../../gradle/plugin-repositories.gradle'

// compileOnly against the host jar (extension point + app classes) plus every library the moved
// ChecksumPanel/ChecksumBean reference directly; these are implementation-scoped in the host, so
// they are not exposed transitively and the host classloader provides them at runtime.
// the host version comes from the root gradle.properties, the one hand-edited version field in
// this repository - never repeated as a literal here, so a release cannot leave it pointing at a
// snapshot that no longer exists (#217)
def hostVersion = new Properties().with { properties ->
    file("../../gradle.properties").withInputStream { properties.load(it) }
    properties.getProperty("projectVersion")
}

dependencies {
    compileOnly "io.github.astrapi69:mystic-crypt-ui:$hostVersion"
    // ClipboardExtensions for the checksum copy buttons
    compileOnly libs.awt.extensions
    // ResourceBundleExtensions.getStringQuietly - the tooltip/label text this plugin loads from
    // checksum/messages.properties falls back to a literal default rather than throwing when a key
    // is missing, the same way the host's own Messages class already behaves
    compileOnly libs.resourcebundle.core
    compileOnly libs.checksum.up
    compileOnly libs.crypt.api
    compileOnly libs.file.worker
    compileOnly libs.model.data
    compileOnly libs.swing.base.components
    // the model backed components the ChecksumAndMacPanel binds to its model
    compileOnly libs.swing.model.components
    // the layout every tool window shares, through the host's ToolForm; the host
    // brings it at runtime
    compileOnly libs.miglayout.swing
    // EnableButtonBehavior lives here
    compileOnly libs.menu.action
    compileOnly libs.lombok
    annotationProcessor libs.lombok

    compileOnly libs.pf4j
    // required so the @Extension annotation processor runs and writes META-INF/extensions.idx
    annotationProcessor libs.pf4j

    // the checksum test drives the checksum library directly (headless)
    testImplementation libs.junit.jupiter
    // SHA-3 and BLAKE2 come from Bouncy Castle, which the host registers at startup
    testImplementation libs.bcprov.jdk18on
    testImplementation libs.checksum.up
    testImplementation libs.crypt.api
    testRuntimeOnly libs.junit.platform.launcher
    // the settings contribution implements the host's extension point and reads through the host's
    // settings store, so the host jar has to be on the test classpath to load it
    // the binding test builds the ChecksumAndMacPanel, so its model backed components have to
    // be on the test classpath the way the host provides them at runtime
    testImplementation libs.swing.model.components
    testImplementation libs.model.data
    testImplementation "io.github.astrapi69:mystic-crypt-ui:$hostVersion"
    // the panel tests lay the panel out, so the shared layout has to be on the test classpath too
    testImplementation libs.miglayout.swing
    testImplementation libs.pf4j
    // the binding test of the ChecksumPanel builds a panel that extends the base panel, starts in
    // the user's downloads directory and enables its clear buttons from a document; the host brings
    // these three at runtime
    testImplementation libs.swing.base.components
    testImplementation libs.file.worker
    testImplementation libs.menu.action
    testImplementation libs.awt.extensions
    testImplementation libs.resourcebundle.core

}

test {
    useJUnitPlatform()
}

// the tests run on a display of the build's own, not on the one the build was started from (#505)
apply from: '../../gradle/own-display.gradle'

// packages the plugin the way the host's DefaultPluginManager expects: plugin.properties at the
// root, compiled classes under classes/
tasks.register('pluginZip', Zip) {
    archiveFileName = "checksum-plugin-${version}.zip"
    destinationDirectory = layout.buildDirectory.dir("plugin-dist")
    from("src/main/resources") {
        include "plugin.properties"
    }
    into("classes") {
        from sourceSets.main.output.classesDirs
        from("src/main/resources") {
            exclude "plugin.properties"
        }
    }
    dependsOn classes
}
