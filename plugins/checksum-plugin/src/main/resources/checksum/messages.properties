# Messages for the checksum plugin
checksum.tooltip.open.file=the file whose checksum is computed
checksum.tooltip.open.file.button=choose the file to check
checksum.tooltip.clear.open.file.button=clears the file to check and the checksum computed for it
checksum.tooltip.generated.checksum=the checksum computed for the file above, using the selected algorithm
checksum.tooltip.copy.generated.checksum.button=copies the generated checksum to the clipboard
checksum.tooltip.checksum.file=the file the checksum below was loaded from, if any
checksum.tooltip.open.checksum.file.button=load a checksum published by the file's owner from a file
checksum.tooltip.clear.checksum.file.button=clears the loaded checksum file and what was typed or loaded below
checksum.tooltip.owners.checksum=the checksum published by the file's owner, typed or loaded from a file
checksum.tooltip.copy.owners.checksum.button=copies the owner's checksum to the clipboard
checksum.tooltip.algorithm=the algorithm used to compute the checksum above - it has to match what the owner used
checksum.tooltip.compare.button=compares the generated checksum with the owner's checksum
checksum.tooltip.match.result=Match or No Match, depending on whether the two checksums above are the same
checksum.and.mac.tooltip.digest=the algorithm used to compute the checksum below
checksum.and.mac.tooltip.checksum.text=the text to compute the checksum of, unless the checkbox below switches to the file
checksum.and.mac.tooltip.checksum.file=the file to compute the checksum of, used instead of the text above once the checkbox below is ticked
checksum.and.mac.tooltip.browse.checksum.file=choose the file to compute the checksum of
checksum.and.mac.tooltip.checksum.use.file=compute the checksum of the file above instead of the text
checksum.and.mac.tooltip.checksum.result=the checksum computed for the text or file above, using the selected algorithm
checksum.and.mac.tooltip.checksum.compute.button=computes the checksum of the text or file above
checksum.and.mac.tooltip.checksum.expected=the checksum to compare the computed one with - pasting one from elsewhere can select the matching algorithm above automatically, by its length
checksum.and.mac.tooltip.checksum.compare.button=computes the checksum and compares it with the value above
checksum.and.mac.tooltip.mac.algorithm=the message authentication code algorithm used below
checksum.and.mac.tooltip.mac.text=the text to compute the code of, unless the checkbox below switches to the file
checksum.and.mac.tooltip.mac.file=the file to compute the code of, used instead of the text above once the checkbox below is ticked
checksum.and.mac.tooltip.browse.mac.file=choose the file to compute the code of
checksum.and.mac.tooltip.mac.use.file=compute the code of the file above instead of the text
checksum.and.mac.tooltip.mac.key=the secret key the code is computed with - the same key is needed to verify it later
checksum.and.mac.tooltip.mac.result=the message authentication code computed for the text or file above, using the selected algorithm and key
checksum.and.mac.tooltip.mac.compute.button=computes the message authentication code of the text or file above
checksum.and.mac.tooltip.mac.expected=the code to compare the computed one with
checksum.and.mac.tooltip.mac.compare.button=computes the code and compares it with the value above
checksum.and.mac.tooltip.result.message=what the last computation or comparison found
