# Messages for the checksum plugin
checksum.tooltip.open.file=the file whose checksum is computed
checksum.tooltip.open.file.button=choose the file to check
checksum.tooltip.clear.open.file.button=clears the file to check and the checksum computed for it
checksum.tooltip.generated.checksum=the checksum computed for the file above, using the selected algorithm
checksum.tooltip.copy.generated.checksum.button=copies the generated checksum to the clipboard
checksum.tooltip.checksum.file=the file the checksum below was loaded from, if any
checksum.tooltip.open.checksum.file.button=load a checksum published by the file's owner from a file
checksum.tooltip.clear.checksum.file.button=clears the loaded checksum file and what was typed or loaded below
checksum.tooltip.owners.checksum=the checksum published by the file's owner, typed or loaded from a file
checksum.tooltip.copy.owners.checksum.button=copies the owner's checksum to the clipboard
checksum.tooltip.algorithm=the algorithm used to compute the checksum above - it has to match what the owner used
checksum.tooltip.compare.button=compares the generated checksum with the owner's checksum
checksum.tooltip.match.result=Match or No Match, depending on whether the two checksums above are the same

# ChecksumAndMacPanel - Checksum tab
checksum.and.mac.tooltip.digest=the digest algorithm to compute the checksum with
checksum.and.mac.tooltip.checksum.text=the text to compute the checksum of
checksum.and.mac.tooltip.checksum.file=the file to compute the checksum of, used instead of the text below when checked
checksum.and.mac.tooltip.checksum.use.file=compute over the file above instead of the typed text
checksum.and.mac.tooltip.checksum=the computed checksum
checksum.and.mac.tooltip.expected.checksum=paste a checksum here to compare it against the computed one
checksum.and.mac.tooltip.browse.checksum.file=choose the file to compute the checksum of
checksum.and.mac.tooltip.compute.checksum=computes the checksum of the text or file above
checksum.and.mac.tooltip.compare.checksum=computes the checksum and compares it with what was pasted below - also picks the digest the pasted value's length implies, if different

# ChecksumAndMacPanel - Message authentication code tab
checksum.and.mac.tooltip.mac.algorithm=the message authentication code algorithm - unlike a checksum, only someone holding the key can produce a matching code
checksum.and.mac.tooltip.mac.text=the text to compute the code for
checksum.and.mac.tooltip.mac.file=the file to compute the code for, used instead of the text below when checked
checksum.and.mac.tooltip.mac.use.file=compute over the file above instead of the typed text
checksum.and.mac.tooltip.mac.key=the shared secret key the code is computed with
checksum.and.mac.tooltip.mac=the computed code
checksum.and.mac.tooltip.expected.mac=paste a code here to compare it against the computed one
checksum.and.mac.tooltip.browse.mac.file=choose the file to compute the code for
checksum.and.mac.tooltip.compute.mac=computes the code of the text or file above, with the key above
checksum.and.mac.tooltip.compare.mac=computes the code and compares it with what was pasted below
