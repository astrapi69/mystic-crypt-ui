# Messages for the checksum plugin
checksum.tooltip.open.file=the file whose checksum is computed
checksum.tooltip.open.file.button=choose the file to check
checksum.tooltip.clear.open.file.button=clears the file to check and the checksum computed for it
checksum.tooltip.generated.checksum=the checksum computed for the file above, using the selected algorithm
checksum.tooltip.copy.generated.checksum.button=copies the generated checksum to the clipboard
checksum.tooltip.checksum.file=the file the checksum below was loaded from, if any
checksum.tooltip.open.checksum.file.button=load a checksum published by the file's owner from a file
checksum.tooltip.clear.checksum.file.button=clears the loaded checksum file and what was typed or loaded below
checksum.tooltip.owners.checksum=the checksum published by the file's owner, typed or loaded from a file
checksum.tooltip.copy.owners.checksum.button=copies the owner's checksum to the clipboard
checksum.tooltip.algorithm=the algorithm used to compute the checksum above - it has to match what the owner used
checksum.tooltip.compare.button=compares the generated checksum with the owner's checksum
checksum.tooltip.match.result=Match or No Match, depending on whether the two checksums above are the same
