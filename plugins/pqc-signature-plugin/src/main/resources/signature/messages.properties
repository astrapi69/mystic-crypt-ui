# Messages for the pqc-signature plugin
signature.tooltip.algorithm=the signature algorithm - Ed25519 and RSA/ECDSA/DSA are classical, ML-DSA and SLH-DSA are post-quantum; a SLH-DSA signature runs tens of kilobytes where an Ed25519 one is 64 bytes
signature.tooltip.message=the text to sign or verify, used instead of the file below unless checked
signature.tooltip.data.file=the file to sign or verify, used instead of the text above when checked
signature.tooltip.use.file=sign or verify the file above instead of the typed text
signature.tooltip.private.key.file=the private key file to sign with - leave blank to use a key pair generated here
signature.tooltip.public.key.file=the public key or certificate file to verify against - leave blank to use a key pair generated here
signature.tooltip.signature.file=the file the signature is saved to or loaded from
signature.tooltip.public.key=the public key, in PEM format
signature.tooltip.signature=the signature, Base64 encoded
signature.tooltip.generate=generates a throwaway key pair for the selected algorithm - only Ed25519, ML-DSA and SLH-DSA can be generated here, RSA/ECDSA/DSA need a key file
signature.tooltip.browse.private.key=choose the private key file
signature.tooltip.browse.public.key=choose the public key or certificate file
signature.tooltip.browse.data.file=choose the file to sign or verify
signature.tooltip.browse.signature.file=choose the signature file
signature.tooltip.sign=signs the message or file above with the private key
signature.tooltip.verify=checks the signature against the message or file above, with the public key
signature.tooltip.save.signature=writes the signature to the signature file above
signature.tooltip.load.signature=reads the signature from the signature file above
