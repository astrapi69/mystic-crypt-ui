plugins {
    id 'java'
}

group = 'io.github.astrapi69'
version = '1.0.0'

java {
    toolchain {
        // must match the host: its classes are compiled for JDK 25 (class file major 69),
        // which a lower toolchain's javac cannot read from the compile classpath
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

// the signers and verifiers live in the mystic-crypt library, the algorithm enum in crypt-api and
// the PEM writers in crypt-data; everything else is the host plus the swing helpers
dependencies {
    compileOnly "io.github.astrapi69:mystic-crypt-ui:8.2-SNAPSHOT"
    compileOnly "io.github.astrapi69:mystic-crypt:12.0.0"
    compileOnly "io.github.astrapi69:crypt-api:10.1"
    compileOnly "io.github.astrapi69:crypt-data:12.0.0"
    // the pem parser that knows every shape a key file comes in lives in bcpkix
    compileOnly "org.bouncycastle:bcpkix-jdk18on:1.85"
    compileOnly "org.bouncycastle:bcprov-jdk18on:1.85.2"
    // the panel keeps its state in a model and binds the model backed components to it
    compileOnly "io.github.astrapi69:swing-model-components:1.2"
    compileOnly "io.github.astrapi69:model-data:3.2.1"
    compileOnly "io.github.astrapi69:swing-base-components:5.1"
    compileOnly "io.github.astrapi69:swing-components:9"
    // the shared tool window layout (ToolForm) is MigLayout based; the host brings the library at
    // runtime, the plugin only compiles against it
    compileOnly "com.miglayout:miglayout-swing:11.4.3"

    compileOnly "org.pf4j:pf4j:3.15.0"
    // required so the @Extension annotation processor runs and writes META-INF/extensions.idx
    annotationProcessor "org.pf4j:pf4j:3.15.0"

    // the round-trip test signs and verifies with every offered algorithm headlessly; the
    // post-quantum algorithms resolve through Bouncy Castle, which the host registers at startup
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testImplementation "io.github.astrapi69:mystic-crypt:12.0.0"
    testImplementation "io.github.astrapi69:crypt-api:10.1"
    testImplementation "io.github.astrapi69:crypt-data:12.0.0"
    // CertFactory declares OperatorCreationException from bcpkix in its throws clause, and X500Name
    // lives in bcutil - javac needs both to compile a call to it
    testImplementation "org.bouncycastle:bcpkix-jdk18on:1.85"
    testImplementation "org.bouncycastle:bcutil-jdk18on:1.85"
    testImplementation "org.bouncycastle:bcprov-jdk18on:1.85.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // the settings contribution implements the host's extension point and reads through the host's
    // settings store, so the host jar has to be on the test classpath to load it
    testImplementation "io.github.astrapi69:mystic-crypt-ui:8.2-SNAPSHOT"
    // the panel binding test constructs the panel, so the model backed components have to be
    // on the test classpath too
    testImplementation "io.github.astrapi69:swing-model-components:1.2"
    testImplementation "io.github.astrapi69:model-data:3.2.1"
    // the panel is laid out with the host's MigLayout based ToolForm, so a test that constructs
    // the panel needs the layout library too
    testImplementation "com.miglayout:miglayout-swing:11.4.3"
    testImplementation "org.pf4j:pf4j:3.15.0"

}

test {
    useJUnitPlatform()
}

// packages the plugin the way the host's DefaultPluginManager expects: plugin.properties at the
// root, compiled classes under classes/
tasks.register('pluginZip', Zip) {
    archiveFileName = "pqc-signature-plugin-${version}.zip"
    destinationDirectory = layout.buildDirectory.dir("plugin-dist")
    from("src/main/resources") {
        include "plugin.properties"
    }
    into("classes") {
        from sourceSets.main.output.classesDirs
        from("src/main/resources") {
            exclude "plugin.properties"
        }
    }
    dependsOn classes
}
