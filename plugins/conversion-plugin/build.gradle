plugins {
    id 'java'
}

group = 'io.github.astrapi69'
version = '1.0.0'

java {
    toolchain {
        // must match the host: its classes are compiled for JDK 25 (class file major 69),
        // which a lower toolchain's javac cannot read from the compile classpath
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

// compileOnly against the host jar (extension point + app classes) plus every library the moved
// FileConversionPanel/FileConversionModelBean reference directly; these are implementation-scoped
// in the host, so they are not exposed transitively and the host classloader provides them at
// runtime.
dependencies {
    compileOnly "io.github.astrapi69:mystic-crypt-ui:8.2-SNAPSHOT"
    compileOnly libs.crypt.api
    compileOnly "io.github.astrapi69:crypt-data:12.2"
    // PemObject and PemWriter, to write a pem file under the right header
    compileOnly "org.bouncycastle:bcprov-jdk18on:1.85.2"
    compileOnly "io.github.astrapi69:model-data:3.2.1"
    // the panels bind their components to one model object per panel (JMTextField and friends)
    compileOnly "io.github.astrapi69:swing-model-components:1.2"
    compileOnly "io.github.astrapi69:swing-base-components:5.1"
    compileOnly "io.github.astrapi69:throwable:3"
    compileOnly "io.github.astrapi69:resourcebundle-core:6.0"
    // the conversion wizard's base classes: AbstractWizardPanel/BaseWizardContentPanel and the
    // BaseWizardState/BaseWizardStateMachineModel state machine it runs on
    compileOnly "io.github.astrapi69:swing-wizard:2.1"
    compileOnly "io.github.astrapi69:state-pattern:7.1"
    compileOnly "org.projectlombok:lombok:1.18.46"
    annotationProcessor "org.projectlombok:lombok:1.18.46"

    // the shared tool window layout comes from the host, which brings MigLayout with it
    compileOnly "com.miglayout:miglayout-swing:11.4.3"

    compileOnly "org.pf4j:pf4j:3.15.0"
    // required so the @Extension annotation processor runs and writes META-INF/extensions.idx
    annotationProcessor "org.pf4j:pf4j:3.15.0"

    // the round-trip test drives the key reader/writer library directly (headless)
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testImplementation libs.crypt.api
    testImplementation "io.github.astrapi69:crypt-data:12.2"
    testImplementation "org.bouncycastle:bcprov-jdk18on:1.85.2"
    testImplementation "org.bouncycastle:bcpkix-jdk18on:1.85"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // the settings contribution implements the host's extension point and reads through the host's
    // settings store, so the host jar has to be on the test classpath to load it
    testImplementation "io.github.astrapi69:mystic-crypt-ui:8.2-SNAPSHOT"
    testImplementation "com.miglayout:miglayout-swing:11.4.3"
    testImplementation "org.pf4j:pf4j:3.15.0"
    // the binding test builds the panel, whose components are bound to its model; the panel is a
    // BasePanel and its combo box an EnumComboBoxModel, both from swing-base-components
    testImplementation "io.github.astrapi69:model-data:3.2.1"
    testImplementation "io.github.astrapi69:swing-model-components:1.2"
    testImplementation "io.github.astrapi69:swing-base-components:5.1"
    testImplementation "io.github.astrapi69:throwable:3"
    // the panels under test resolve their tooltip text through ConversionMessages at construction
    // time, so the resource bundle loader has to be on the test classpath too
    testImplementation "io.github.astrapi69:resourcebundle-core:6.0"
    // the wizard state/panel tests build the real state machine and the real panels
    testImplementation "io.github.astrapi69:swing-wizard:2.1"
    testImplementation "io.github.astrapi69:state-pattern:7.1"

}

test {
    useJUnitPlatform()
    // crypt-data's key readers reflect into java.util at runtime on JDK 9+
    jvmArgs "--add-opens", "java.base/java.util=ALL-UNNAMED"
}

// packages the plugin the way the host's DefaultPluginManager expects: plugin.properties at the
// root, compiled classes under classes/
tasks.register('pluginZip', Zip) {
    archiveFileName = "conversion-plugin-${version}.zip"
    destinationDirectory = layout.buildDirectory.dir("plugin-dist")
    from("src/main/resources") {
        include "plugin.properties"
    }
    into("classes") {
        from sourceSets.main.output.classesDirs
        from("src/main/resources") {
            exclude "plugin.properties"
        }
    }
    dependsOn classes
}
