# Messages for the conversion plugin's guided wizard
conversion.wizard.source.tooltip.source.file=the key or certificate file to convert - its own content says what it holds, nothing has to be chosen
conversion.wizard.source.tooltip.browse.button=choose the file to convert
conversion.wizard.source.tooltip.what.it.holds=what the chosen file was found to hold
conversion.wizard.target.tooltip.what.it.holds=what the source file was found to hold
conversion.wizard.target.tooltip.operation.pem_to_der=converts the source PEM file to the binary DER encoding
conversion.wizard.target.tooltip.operation.der_to_pem=converts the source DER file to the text PEM encoding
conversion.wizard.target.tooltip.operation.to_pkcs8=converts the source private key to PKCS#8, the encoding Java reads
conversion.wizard.target.tooltip.operation.to_pkcs1=converts the source private key to PKCS#1, the encoding openssl reads
conversion.wizard.target.tooltip.target.file=the file to write to - left blank, a default next to the source file is used
conversion.wizard.target.tooltip.browse.button=choose where to write the result
conversion.wizard.review.tooltip.summary=a read-only summary of what Finish would do
