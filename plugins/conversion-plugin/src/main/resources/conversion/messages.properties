# Messages for the conversion plugin
conversion.tooltip.source.file=the key or certificate file to convert - its own content says what it holds, nothing has to be chosen
conversion.tooltip.browse.source.button=choose the file to convert
conversion.tooltip.what.it.holds=what the chosen file was found to hold
conversion.tooltip.target.file=the file to write to - left blank, the result is written next to the source file
conversion.tooltip.browse.target.button=choose where to write the result
conversion.tooltip.pem.to.der.button=converts the chosen PEM file to the binary DER encoding
conversion.tooltip.der.to.pem.button=converts the chosen DER file to the text PEM encoding
conversion.tooltip.to.pkcs8.button=converts the chosen private key to PKCS#8, the encoding Java reads
conversion.tooltip.to.pkcs1.button=converts the chosen private key to PKCS#1, the encoding openssl reads
conversion.tooltip.result=what the last conversion did
conversion.file.tooltip.choose.type=the kind of DER content to read - determines how the file below is parsed
conversion.file.tooltip.choose.button=choose the DER file to convert
conversion.file.tooltip.save.to.button=choose where the converted PEM file is written
conversion.file.tooltip.convert.button=reads the DER file as the chosen type and writes it as PEM
conversion.file.tooltip.console=what each conversion did, in order
