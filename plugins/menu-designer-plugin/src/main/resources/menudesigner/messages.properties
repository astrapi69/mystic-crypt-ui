# Messages for the menu-designer plugin
menudesigner.tooltip.menu.xml=the xml layout of the application menu, in the schema Export produces
menudesigner.tooltip.export.button=replaces the editor's content with the menu bar currently in place, so it can be reviewed or edited
menudesigner.tooltip.validate.button=checks the edited xml without touching the running application
menudesigner.tooltip.apply.button=rebuilds the live menu bar from the edited xml - not saved, lost on restart unless Save is used too
menudesigner.tooltip.save.button=persists the edited xml so it is applied again on the next start
menudesigner.tooltip.reset.button=removes the saved menu layout - destructive, the standard menu returns on the next start
menudesigner.tooltip.result=what the last operation did
