// The own-display and test-results-complete plugins are published to Maven Central, so Gradle looks for
// plugins there as well as in the Gradle Plugin Portal (#741)
pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'menu-designer-plugin'

// shares the host's version catalog, as every other plugin build does: this plugin is its own
// Gradle build, so the catalog is pointed at explicitly (#213, #533)
dependencyResolutionManagement {
    versionCatalogs {
        libs {
            from(files("../../gradle/libs.versions.toml"))
        }
    }
}
