# Messages for the keystore plugin
keystore.tooltip.file=the .jks or .p12 file this tool works on
keystore.tooltip.type=the key store format - JKS or PKCS12
keystore.tooltip.password=the password that opens and protects this key store
keystore.tooltip.alias=the name an entry is stored and looked up under
keystore.tooltip.distinguished.name=the subject of the self-signed certificate generated with a new key pair, for example CN=example.com
keystore.tooltip.key.algorithm=the algorithm a newly generated key pair uses
keystore.tooltip.certificate.file=the certificate file used to import or export
keystore.tooltip.private.key.file=the private key file used together with the certificate to import a key pair
keystore.tooltip.browse=choose the key store file
keystore.tooltip.open=opens the key store file above
keystore.tooltip.create=creates a new, empty key store at the file above - refuses to overwrite an existing one
keystore.tooltip.add.key.pair=generates a new key pair with a self-signed certificate and adds it under the alias above
keystore.tooltip.delete=removes the selected alias from the key store
keystore.tooltip.browse.certificate=choose the certificate file
keystore.tooltip.import=imports the certificate file above under the alias
keystore.tooltip.export=exports the selected alias's certificate as PEM to the certificate file above, or next to the key store file if left blank
keystore.tooltip.import.key.pair=imports the private key and certificate files above together, under the alias
keystore.tooltip.add.secret.key=adds a new AES secret key under the alias above
keystore.tooltip.details=shows the full details of the selected alias's certificate
keystore.tooltip.browse.private.key=choose the private key file

# Create Key Store... wizard
keystore.wizard.store.tooltip.file=where the new key store is written
keystore.wizard.store.tooltip.browse=choose where to write the new key store
keystore.wizard.store.tooltip.type=the key store format - JKS, PKCS12 or JCEKS
keystore.wizard.store.tooltip.password=the password that will protect the new key store
keystore.wizard.store.tooltip.password.repeated=the same password again - a typo here that nothing catches locks the store immediately
keystore.wizard.entry.tooltip.add.key.pair=generate one key pair with a self-signed certificate right away, or leave the new store empty
keystore.wizard.entry.tooltip.alias=the name the first entry is stored and looked up under
keystore.wizard.entry.tooltip.distinguished.name=the subject of the self-signed certificate, for example CN=example.com
keystore.wizard.entry.tooltip.key.algorithm=the algorithm the first key pair is generated with
keystore.wizard.review.tooltip.summary=a read-only summary of what Finish would do
