plugins {
    id 'java'
}

group = 'io.github.astrapi69'
version = '1.0.0'

java {
    toolchain {
        // must match the host: its classes are compiled for JDK 25 (class file major 69),
        // which a lower toolchain's javac cannot read from the compile classpath
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

// the key store handling comes from crypt-data (KeyStoreFactory, KeyStoreExtensions, the
// certificate readers and writers) and crypt-api (KeystoreType, HashAlgorithm); the host and the
// swing helpers are only needed to open the tool window
dependencies {
    compileOnly "io.github.astrapi69:mystic-crypt-ui:8.2-SNAPSHOT"
    // KeystoreVerifier, to tell what kind of key store a file is
    compileOnly "io.github.astrapi69:mystic-crypt:12.1"
    // ResourceBundleExtensions.getStringQuietly - tooltip/label text from keystore/messages.properties
    // falls back to a literal default rather than throwing when a key is missing, the same way the
    // host's own Messages class already behaves (.claude/rules/i18n.md)
    compileOnly "io.github.astrapi69:resourcebundle-core:6.0"
    compileOnly "io.github.astrapi69:swing-base-components:5.1"
    compileOnly "io.github.astrapi69:swing-components:9"
    // the model backed components the panel binds to its model; the host brings both jars at
    // runtime, so they stay compileOnly here like everything else
    compileOnly "io.github.astrapi69:swing-model-components:1.2"
    compileOnly "io.github.astrapi69:model-data:3.2.1"
    // the "Create Key Store..." wizard's base classes: AbstractWizardPanel/BaseWizardContentPanel
    // and the BaseWizardState/BaseWizardStateMachineModel state machine it runs on
    compileOnly "io.github.astrapi69:swing-wizard:2.1"
    compileOnly "io.github.astrapi69:state-pattern:7.1"
    // X500Name, used to build the subject of a self-signed certificate, lives in bcutil; the host
    // brings both jars at runtime, so they stay compileOnly here like everything else
    compileOnly "org.bouncycastle:bcprov-jdk18on:1.85.2"
    compileOnly "org.bouncycastle:bcutil-jdk18on:1.85"
    // CertFactory declares OperatorCreationException from bcpkix in its throws clause, so javac
    // needs that jar on the compile classpath even though this code never names the type
    compileOnly "org.bouncycastle:bcpkix-jdk18on:1.85"

    // the command line side: the host puts picocli on the classpath, so like everything else it
    // is only needed to compile against here
    compileOnly "info.picocli:picocli:4.7.6"

    // the shared tool window layout comes from the host, which brings MigLayout with it
    compileOnly "com.miglayout:miglayout-swing:11.4.3"

    compileOnly "org.pf4j:pf4j:3.15.0"
    // required so the @Extension annotation processor runs and writes META-INF/extensions.idx
    annotationProcessor "org.pf4j:pf4j:3.15.0"

    // the tests drive real key stores on disk; certificate creation and the PKCS12 handling go
    // through Bouncy Castle, which the host registers at startup
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testImplementation "io.github.astrapi69:mystic-crypt:12.1"
    testImplementation "info.picocli:picocli:4.7.6"
    // the contribution class implements the host's extension point, so the host jar has to be on
    // the test classpath to load it - for the main sources it stays compileOnly like everything else
    testImplementation "io.github.astrapi69:mystic-crypt-ui:8.2-SNAPSHOT"
    testImplementation "com.miglayout:miglayout-swing:11.4.3"
    // the panel test constructs the panel, so the model backed components and the combo box models
    // it is built from have to be on the test classpath as well
    testImplementation "io.github.astrapi69:swing-model-components:1.2"
    testImplementation "io.github.astrapi69:model-data:3.2.1"
    testImplementation "io.github.astrapi69:swing-base-components:5.1"
    // the wizard state/panel tests build the real state machine and the real panels
    testImplementation "io.github.astrapi69:swing-wizard:2.1"
    testImplementation "io.github.astrapi69:state-pattern:7.1"
    testImplementation "org.pf4j:pf4j:3.15.0"
    testImplementation "org.bouncycastle:bcprov-jdk18on:1.85.2"
    testImplementation "org.bouncycastle:bcpkix-jdk18on:1.85"
    testImplementation "io.github.astrapi69:resourcebundle-core:6.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

// packages the plugin the way the host's DefaultPluginManager expects: plugin.properties at the
// root, compiled classes under classes/
tasks.register('pluginZip', Zip) {
    archiveFileName = "keystore-plugin-${version}.zip"
    destinationDirectory = layout.buildDirectory.dir("plugin-dist")
    from("src/main/resources") {
        include "plugin.properties"
    }
    into("classes") {
        from sourceSets.main.output.classesDirs
        from("src/main/resources") {
            exclude "plugin.properties"
        }
    }
    dependsOn classes
}
