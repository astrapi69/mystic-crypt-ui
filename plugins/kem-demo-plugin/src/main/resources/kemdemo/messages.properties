# Messages for the kem-demo plugin
kemdemo.tooltip.algorithm=the key-encapsulation mechanism to demonstrate - the pure ML-KEM sizes trade security level for speed and size, the hybrid mode adds classical X25519 alongside ML-KEM-768 so the exchange stays secure even if one of the two breaks
kemdemo.tooltip.run.button=runs the whole exchange: generates a key pair, encapsulates a shared secret against it, decapsulates it back, and shows both sides
kemdemo.tooltip.ciphertext=what the sender's encapsulation produces and hands to the recipient
kemdemo.tooltip.sender.secret=the shared secret the sender derived while encapsulating
kemdemo.tooltip.recipient.secret=the shared secret the recipient derived by decapsulating the ciphertext - equal to the sender's secret when the exchange worked
kemdemo.tooltip.result=whether the two derived secrets matched, or what went wrong
key.exchange.tooltip.algorithm=the key exchange mechanism used by both tabs
key.exchange.tooltip.my.public.key=your public key - hand this to the other side, it is safe to share
key.exchange.tooltip.new.key.pair.button=generates a fresh key pair for you to receive with
key.exchange.tooltip.save.my.key.button=saves your private key to a file - whoever gets it can read everything ever sent to this key pair
key.exchange.tooltip.load.my.key.button=loads a previously saved private key, replacing the current one
key.exchange.tooltip.save.my.public.key.button=saves your public key to a file, to hand to the other side
key.exchange.tooltip.handshake.in=the handshake the other side sent back after encapsulating against your public key
key.exchange.tooltip.load.handshake.button=loads a handshake from a file
key.exchange.tooltip.decapsulate.button=derives the shared secret from the handshake above, using your private key
key.exchange.tooltip.my.fingerprint=the fingerprint of your derived secret - read it out to the other side, it must match theirs
key.exchange.tooltip.encrypted.in=a message the other side encrypted with the shared secret
key.exchange.tooltip.decrypt.message.button=decrypts the message above with the derived shared secret
key.exchange.tooltip.message.received=the decrypted message
key.exchange.tooltip.their.public.key=the public key you were given by the other side
key.exchange.tooltip.load.their.public.key.button=loads a public key from a file
key.exchange.tooltip.encapsulate.button=derives a fresh shared secret against the public key above and produces the handshake to send back
key.exchange.tooltip.their.fingerprint=the fingerprint of the shared secret you derived - read it out to the other side, it must match theirs
key.exchange.tooltip.handshake.out=the handshake to send back to the other side
key.exchange.tooltip.save.handshake.button=saves the handshake to a file
key.exchange.tooltip.message.to.send=the message to encrypt and send along with the handshake
key.exchange.tooltip.encrypt.message.button=encrypts the message above with the shared secret
key.exchange.tooltip.encrypted.out=the encrypted message to send
key.exchange.tooltip.save.encrypted.button=saves the encrypted message to a file
key.exchange.tooltip.result=what the last action did
