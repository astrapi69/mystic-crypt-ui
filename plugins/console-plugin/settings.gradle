rootProject.name = 'console-plugin'

// shares the host's version catalog, as every other plugin build does: this plugin is its own
// independent Gradle build, so Gradle's automatic gradle/libs.versions.toml detection does not apply
// (#197, #547)
dependencyResolutionManagement {
    versionCatalogs {
        libs {
            from(files("../../gradle/libs.versions.toml"))
        }
    }
}
