# Messages for the secret-sharing plugin
sharing.tooltip.secret=the secret to split, typed directly
sharing.tooltip.secret.file=the file to split, used instead of the secret above when checked
sharing.tooltip.use.file=split the file above instead of the typed secret
sharing.tooltip.threshold=how many shares are enough to rebuild the secret - fewer than this reveal nothing
sharing.tooltip.total.shares=how many shares are produced in total
sharing.tooltip.shares=the shares, one per line - paste them here to rebuild the secret, or read them back after splitting
sharing.tooltip.rebuilt=the secret rebuilt from the shares
sharing.tooltip.rebuilt.file=the file the rebuilt secret is written to
sharing.tooltip.browse.secret.file=choose the file to split
sharing.tooltip.split=splits the secret or file above into shares - keep them apart from each other
sharing.tooltip.save.shares=writes the shares to one text file for now - move each share to its own safe place afterward, they must not stay together
sharing.tooltip.combine=rebuilds the secret from the shares above
sharing.tooltip.load.shares=reads shares from a file into the field above
sharing.tooltip.browse.rebuilt.file=choose where to write the rebuilt secret
sharing.tooltip.save.rebuilt=writes the rebuilt secret to the file above
