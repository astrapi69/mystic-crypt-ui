plugins {
    id 'java'
}

group = 'io.github.astrapi69'
version = '1.0.0'

java {
    toolchain {
        // must match the host: its classes are compiled for JDK 25 (class file major 69),
        // which a lower toolchain's javac cannot read from the compile classpath
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

// compileOnly against the host jar and the mystic-crypt library that provides the Argon2id / PBKDF2
// password hashing (PasswordEncryptor), plus the swing helpers the plugin uses to open its tool.
dependencies {
    compileOnly "io.github.astrapi69:mystic-crypt-ui:8.2-SNAPSHOT"
    // PasswordEncryptor / Argon2Support / Pbkdf2Support live in the mystic-crypt library
    compileOnly "io.github.astrapi69:mystic-crypt:12.1"
    // ResourceBundleExtensions.getStringQuietly - tooltip/label text from password/messages.properties
    // falls back to a literal default rather than throwing when a key is missing, the same way the
    // host's own Messages class already behaves (.claude/rules/i18n.md)
    compileOnly "io.github.astrapi69:resourcebundle-core:6.0"
    compileOnly "io.github.astrapi69:swing-base-components:5.1"
    compileOnly "io.github.astrapi69:swing-components:9"
    // the model backed components the panel binds to its model; the host brings both jars at
    // runtime, so they stay compileOnly here like everything else
    compileOnly "io.github.astrapi69:swing-model-components:1.2"
    compileOnly "io.github.astrapi69:model-data:3.2.1"
    compileOnly "org.projectlombok:lombok:1.18.46"
    annotationProcessor "org.projectlombok:lombok:1.18.46"

    // the shared tool window layout comes from the host, which brings MigLayout with it
    compileOnly "com.miglayout:miglayout-swing:11.4.3"

    compileOnly "org.pf4j:pf4j:3.15.0"
    // required so the @Extension annotation processor runs and writes META-INF/extensions.idx
    annotationProcessor "org.pf4j:pf4j:3.15.0"

    // the round-trip test drives the Argon2id / PBKDF2 hashing + verification headlessly
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testImplementation "io.github.astrapi69:mystic-crypt:12.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // the settings contribution implements the host's extension point and reads through the host's
    // settings store, so the host jar has to be on the test classpath to load it
    testImplementation "io.github.astrapi69:mystic-crypt-ui:8.2-SNAPSHOT"
    testImplementation "com.miglayout:miglayout-swing:11.4.3"
    // the binding test builds the panel, so the model backed components and the models they bind
    // to have to be on the test classpath as well
    testImplementation "io.github.astrapi69:swing-model-components:1.2"
    testImplementation "io.github.astrapi69:model-data:3.2.1"
    testImplementation "org.pf4j:pf4j:3.15.0"
    testImplementation "io.github.astrapi69:resourcebundle-core:6.0"

}

test {
    useJUnitPlatform()
}

// packages the plugin the way the host's DefaultPluginManager expects: plugin.properties at the
// root, compiled classes under classes/
tasks.register('pluginZip', Zip) {
    archiveFileName = "password-hash-plugin-${version}.zip"
    destinationDirectory = layout.buildDirectory.dir("plugin-dist")
    from("src/main/resources") {
        include "plugin.properties"
    }
    into("classes") {
        from sourceSets.main.output.classesDirs
        from("src/main/resources") {
            exclude "plugin.properties"
        }
    }
    dependsOn classes
}
