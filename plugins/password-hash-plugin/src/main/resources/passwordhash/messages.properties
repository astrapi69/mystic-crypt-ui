# Messages for the password-hash plugin
passwordhash.tooltip.algorithm=the algorithm used to hash the password below - the description to the right explains the tradeoff
passwordhash.tooltip.password=the password to hash
passwordhash.tooltip.hash=the computed hash - or paste one here to verify a password against it
passwordhash.tooltip.verify.password=the password to check against the hash above
passwordhash.tooltip.hash.button=hashes the password above with the selected algorithm
passwordhash.tooltip.verify.button=checks the password below against the hash above - the algorithm is read from the hash itself
