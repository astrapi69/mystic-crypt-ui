######################
# project properties #
######################
projectVersion=8.7
# the published release a vault this build writes has to stay readable in, as long as it holds nothing
# that release has no field for. Its application jar is fetched by 'make release-jar' (#402)
formatCompatibilityRelease=8.5.1
# the last release that sealed its vault with this application's own PassphraseBox, before #490 moved
# the construction into mystic-crypt. A vault it wrote opens in this build and one this build writes
# opens in it, so the move is shown not to have touched the format. Fetched by 'make release-jar' too
envelopeMoveRelease=8.6
groupPackage=io.github.astrapi69
projectSourceCompatibility=25
projectInceptionYear=2015
projectHolderUsername=astrapi69
projectLeaderName=Asterios Raptis
slash=/
colon=:
ad=@
issuesPath=/issues
projectDescription=Demo application for the library mystic-crypt project
projectScmProviderDomain=github.com
projectScmProviderUrl=https://github.com/
projectScmGitUrlPrefix=scm:git:git:@
projectScmGitUrlSuffix=.git
projectLicenseName=MIT License
projectLicenseUrl=http://www.opensource.org/licenses/mit-license.php
projectOrganizationName=Asterios Raptis
projectOrganizationEmailName=asterios.raptis
projectOrganizationEmailDomain=gmx.net
projectOrganizationUrl=https://astrapi69.github.io/
projectLicenseDistribution=repo
projectIssueManagementSystem=GitHub
projectRepositoriesSnapshotsRepoUrl=https://central.sonatype.com/repository/maven-snapshots/
projectRepositoriesSnapshotsName=Central Portal Snapshots
projectRepositoriesMavenUrl=https://plugins.gradle.org/m2/
#####################################
# Deployment and install properties #
#####################################
############################
# IzPackInstaller property #
############################
createIzPackInstaller=false
##################
# jar properties #
##################
mainClass=io.github.astrapi69.mystic.crypt.StartMysticCryptApplication
############################
# keystore properties keys #
############################
mysticCryptStoreFile=release.mystic-crypt.store.file
mysticCryptStoreType=release.mystic-crypt.store.type
mysticCryptStorePassword=release.mystic-crypt.store.password
mysticCryptKeyPassword=release.mystic-crypt.key.password
mysticCryptKeyAlias=release.mystic-crypt.key.alias
##############################
# for deployment on sonatype #
##############################
systemProp.org.gradle.internal.publish.checksums.insecure=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.vfs.watch=true
org.gradle.configuration-cache=true
# the grgit plugin starts git processes at configuration time, which the configuration cache
# treats as an error by default - degrade such findings to warnings so the build still passes
# (the cache entry for affected runs is simply discarded)
org.gradle.configuration-cache.problems=warn
