buildscript {
    repositories {
        maven {
            url = projectRepositoriesMavenUrl
        }
    }
}

plugins {
    id 'idea'
    id 'jacoco'
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    alias(libs.plugins.gradle.izpack.plugin)
    alias(libs.plugins.gradle.versions.plugin)
    alias(libs.plugins.grgit.gradle)
    alias(libs.plugins.license.gradle.plugin)
    alias(libs.plugins.lombok.plugin)
    alias(libs.plugins.pitest.gradle.plugin)
    alias(libs.plugins.spotless.plugin.gradle)
    alias(libs.plugins.version.catalog.update)
}

group = "$groupPackage" as Object
version = "$projectVersion" as Object
description = "$rootProject.name"

// import gradle files
apply from: "gradle/apply-gradle-files.gradle"

java {
    sourceCompatibility = "$projectSourceCompatibility" as Object
    toolchain {
        languageVersion = JavaLanguageVersion.of("$projectSourceCompatibility")
    }
}

tasks.withType(JavaCompile).configureEach { javaCompiler ->
    options.encoding = "UTF-8"
    // uncomment the next line for build with compiler argument -Xlint:deprecation
    // options.compilerArgs << "-Xlint:deprecation"
    // uncomment the next line for build with compiler argument -Xlint:unchecked
    // options.compilerArgs << "-Xlint:unchecked"
}

tasks.named("test") {
    it.mustRunAfter(tasks.named("jar"))
    // KeePassJava2-simple's SimpleXML-based serialization reflects into java.util (e.g. UUID)
    // at runtime, which the JDK 9+ module system blocks without this on JDK 17+
    it.jvmArgs "--add-opens", "java.base/java.util=ALL-UNNAMED"
    // XStream asks once per JVM whether it may write fields through sun.misc.Unsafe, by trying it.
    // That method is deprecated for removal, so JDK 25 prints a five line warning for the attempt -
    // once per forked test JVM, and forkEvery is 1, so the suite drowns in them. The probe is
    // guarded (XStream falls back to SunLimitedUnsafeReflectionProvider when the call fails), so
    // this permits what XStream is going to do anyway and keeps the test output readable
    it.jvmArgs "--sun-misc-unsafe-memory-access=allow"
    // forward -Dmystic.crypt.ui.test.mode=demo to the forked test JVM (UiTestSpeed), e.g.
    // ./gradlew test -Dmystic.crypt.ui.test.mode=demo
    if (System.getProperty("mystic.crypt.ui.test.mode") != null) {
        it.systemProperty "mystic.crypt.ui.test.mode", System.getProperty("mystic.crypt.ui.test.mode")
    }
    // in a Wayland session java.awt.Robot (used by AssertJ-Swing) takes screenshots through the
    // XDG desktop portal, which pops up a "share your screen" permission dialog on every UI-test
    // run - force the X11 path instead (the Swing windows run on XWayland anyway); ignored on
    // plain X11 and in headless environments
    it.systemProperty "awt.robot.screenshotMethod", "x11"
}
