# certificate wizard - Issuer/Subject shared attributes
wizard.certificate.attributes.tooltip.common.name=the name the certificate identifies - a person, a server's hostname, or a service
wizard.certificate.attributes.tooltip.organisation=the company or organisation this certificate is issued for, if any
wizard.certificate.attributes.tooltip.organisation.unit=the department or division within the organisation, if any
wizard.certificate.attributes.tooltip.country.code=the two-letter ISO 3166-1 country code, for example DE or US
wizard.certificate.attributes.tooltip.state=the state or province, written out in full rather than abbreviated
wizard.certificate.attributes.tooltip.location=the city or locality

# certificate wizard - Dates step
wizard.certificate.dates.tooltip.version=the X.509 version - version 1 has no extensions step, version 3 adds one
wizard.certificate.dates.tooltip.serial.number=the certificate's unique serial number, assigned by whoever issues it
wizard.certificate.dates.tooltip.generate.serial.number=fills the serial number with a fresh random value
wizard.certificate.dates.tooltip.not.before=the date the certificate becomes valid
wizard.certificate.dates.tooltip.not.after=the date the certificate expires
wizard.certificate.dates.tooltip.signature.algorithm=the algorithm used to sign the certificate - it has to match what the private key can produce

# certificate wizard - Extensions step
wizard.certificate.extensions.tooltip.kind=which X.509 extension to add - picking one fills in its object id below
wizard.certificate.extensions.tooltip.id=the extension's object identifier (OID), filled in automatically for a known kind
wizard.certificate.extensions.tooltip.value=the extension's value, in the format the hint below describes
wizard.certificate.extensions.tooltip.critical=whether a system that does not understand this extension must reject the certificate
wizard.certificate.extensions.tooltip.add=adds the extension above to the certificate
wizard.certificate.extensions.tooltip.edit=applies the fields above to the selected row
wizard.certificate.extensions.tooltip.delete=removes the selected extension

# certificate wizard - Review step
wizard.certificate.review.tooltip.preview=a read-only preview of what would be written to the file
wizard.certificate.review.tooltip.file.name=the file name the certificate is saved as, defaults to the subject's common name
wizard.certificate.review.tooltip.save.directory=the folder the certificate is saved in
wizard.certificate.review.tooltip.browse=choose the folder to save the certificate in

# NewCertificateInfoPanel
certificate.info.tooltip.version=the X.509 version this certificate is created in
certificate.info.tooltip.serial.number=the certificate's unique serial number, assigned by whoever issues it
certificate.info.tooltip.issuer=the distinguished name of whoever signs this certificate, for example CN=example.com
certificate.info.tooltip.subject=the distinguished name this certificate identifies, for example CN=example.com
certificate.info.tooltip.not.before=the date the certificate becomes valid, as a full ISO date and time, for example 2026-01-01T00:00:00Z - anything else is silently ignored while typing
certificate.info.tooltip.not.after=the date the certificate expires, as a full ISO date and time, for example 2027-01-01T00:00:00Z - anything else is silently ignored while typing
certificate.info.tooltip.signature.algorithm=the algorithm used to sign the certificate - it has to match what the private key can produce
certificate.info.tooltip.public.key=the public key this certificate carries, in PEM format
certificate.info.tooltip.create.issuer=opens a dialog to fill in the issuer's name, organisation and location field by field
certificate.info.tooltip.create.subject=opens a dialog to fill in the subject's name, organisation and location field by field
certificate.info.tooltip.generate.serial.number=fills the serial number with a fresh random value
