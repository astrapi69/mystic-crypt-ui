dialog.vault.format.unknown.title=Datenbank nicht geöffnet
dialog.vault.format.unknown.message=Die Schlüsseldatei hat den Schlüssel dieser Datenbank geöffnet, aber ihr Inhalt liegt in keinem Format vor, das diese Version liest (%1$s). Sie wurde nicht geöffnet, die Datei ist unverändert.
dialog.key.file.missing.message=Die Schlüsseldatei %1$s ist nicht da. Sie wurde verschoben oder gelöscht, oder sie liegt auf einem Laufwerk, das nicht angeschlossen ist. Lege sie wieder an diesen Ort und versuche es erneut.
dialog.key.file.not.set.message=Für diese Datenbank ist keine Schlüsseldatei angegeben.
