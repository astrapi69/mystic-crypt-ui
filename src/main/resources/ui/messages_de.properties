keepass.import.failed.title=Import fehlgeschlagen
keepass.import.failed.message=Die KeePass-Datei konnte nicht importiert werden:
keepass.import.failed.kdbx31.protected.attachments=Diese KeePass-Datei hat das Format KDBX 3.1 und enthält geschützte Anhänge,\ndie der Import noch nicht lesen kann. Es wurde nichts importiert.\n\nAls KDBX 4 in KeePassXC gespeichert, lässt sich die Datei importieren:\nin KeePassXC öffnen, Datenbank > Datenbankeinstellungen... > Sicherheit >\nVerschlüsselungs-Einstellungen wählen, das Datenbankformat auf KDBX 4 (empfohlen)\nstellen, mit OK bestätigen, die Datenbank speichern und erneut importieren.
