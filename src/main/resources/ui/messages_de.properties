settings.general.tooltip.remember.key.files=ob der Anmeldedialog und die KeePass-Dialoge Schlüsseldateien merken; ausgeschaltet wird kein Pfad einer Schlüsseldatei in die Dateien des Konfigurationsverzeichnisses der Anwendung geschrieben (die gemerkte Anmeldung und die gemerkten KeePass-Pfade), und die schon dort stehenden werden entfernt, außer in einer als .unreadable-* beiseitegelegten Kopie, die Sie löschen können; der Tresor behält die Pfade der Schlüsseldateien, mit denen er geöffnet wurde
