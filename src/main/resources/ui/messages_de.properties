signin.help.open.title=Hilfe zur Anmeldung an Ihrer Datenbank
signin.help.open.dialog.title=Hilfe zur Anmeldung an Ihrer Datenbank
signin.help.open.content=Ihre mystic-crypt-Datenbank ist eine verschlüsselte Datei.\n\
\n\
Zum Öffnen brauchen Sie Ihren Hauptschlüssel.\n\
Ihr Hauptschlüssel besteht aus einem Passwort, einem privaten Schlüssel oder beidem.\n\
\n\
Der Hauptschlüssel wird beim Anlegen der mystic-crypt-Datenbank festgelegt.\n\
Haben Sie beim Anlegen nur ein Passwort gewählt, geben Sie nur das Passwort ein.\n\
Haben Sie nur einen privaten Schlüssel gewählt, wählen Sie nur den privaten Schlüssel aus.\n\
Haben Sie beides gewählt, geben Sie das Passwort ein und wählen Sie den privaten Schlüssel aus.\n\
Sobald der Hauptschlüssel gesetzt ist, öffnen Sie die mystic-crypt-Datenbank mit OK.
signin.help.create.title=Hilfe zum Anlegen einer neuen mystic-crypt-Datenbank
signin.help.create.dialog.title=Hilfe zum Anlegen einer neuen mystic-crypt-Datenbank
signin.help.create.content=Um eine neue mystic-crypt-Datenbank anzulegen und Ihre Daten zu verschlüsseln,\n\
legen Sie zuerst die Anwendungsdatei fest.\n\
\n\
Setzen Sie dann Ihren Hauptschlüssel: ein Passwort, einen privaten Schlüssel oder beides.\n\
Nur mit Passwort: Passwort-Kontrollkästchen anhaken, das Kontrollkästchen für den\n\
privaten Schlüssel nicht anhaken und das Passwort setzen.\n\
Nur mit privatem Schlüssel: Kontrollkästchen für den privaten Schlüssel anhaken,\n\
das Passwort-Kontrollkästchen nicht anhaken und den privaten Schlüssel setzen.\n\
Mit beidem: beide Kontrollkästchen anhaken und Passwort und privaten Schlüssel setzen.\n\
\n\
Danach speichern Sie die mystic-crypt-Datenbank mit OK.\n\
Kopieren Sie in jedem Fall das Passwort, den privaten Schlüssel oder beides an einen\n\
sicheren Ort und sichern Sie sie. Dasselbe gilt für die mystic-crypt-Datenbank-Datei.
