
izpack {
    DirectoryProperty buildDirectoryProperty = layout.buildDirectory
    String buildDirectory = buildDirectoryProperty.get()
    baseDir = file("$buildDirectory")
    installFile = file("src/main/izpack/install.xml")
    outputFile = file("$buildDirectory/distributions/$rootProject.name-${projectVersion}-installer.jar")
    compression = "deflate"
    compressionLevel = 9
    appProperties = ["app.group": "$groupPackage",
                     "app.name": "$rootProject.name",
                     "app.title": "$rootProject.name",
                     "app.version": "$projectVersion",
                     "app.java.version": "$projectSourceCompatibility",
                     "app.author": "$projectLeaderName",
                     "app.author.email": "$projectOrganizationEmailName" + "$ad" + "$projectOrganizationEmailDomain",
                     "app.url": "$projectScmProviderUrl" + "$projectHolderUsername" + "$slash" + "$rootProject.name",
                     "app.subpath": "$rootProject.name-${projectVersion}"]
}

/**
 * Writes a SHA-256 and a SHA-512 file next to the installer, in the format sha256sum and sha512sum
 * read and write - "<hash>  <filename>" - so a user can verify a download with the tools they
 * already have, and with this application's own checksum panel.
 *
 * A checksum computed on the machine that built the artifact says the download arrived intact. It
 * does not say who built it, which is a separate question (#228).
 */
tasks.register('checksumInstaller') {
    description = "Writes the SHA-256 and SHA-512 files that belong next to the installer."
    DirectoryProperty buildDirectoryProperty = layout.buildDirectory
    File installer = file("${buildDirectoryProperty.get()}/distributions/$rootProject.name-${projectVersion}-installer.jar")
    Map<String, String> digests = ["SHA-256": "sha256", "SHA-512": "sha512"]
    inputs.file(installer).withPropertyName("installer")
    outputs.files(digests.values().collect { new File(installer.parentFile, "${installer.name}.$it") })
    doLast {
        digests.each { algorithm, extension ->
            def digest = java.security.MessageDigest.getInstance(algorithm)
            installer.withInputStream { stream ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = stream.read(buffer)) != -1) {
                    digest.update(buffer, 0, read)
                }
            }
            String hex = digest.digest().encodeHex().toString()
            File checksumFile = new File(installer.parentFile, "${installer.name}.$extension")
            checksumFile.setText("$hex  ${installer.name}\n", "US-ASCII")
            logger.lifecycle("wrote ${checksumFile.name}")
        }
    }
}

/**
 * Deletes an installer that cannot be one. A failed izpack run leaves its output file behind, empty:
 * measured at 0 bytes when the signed uber jar was missing. Nothing hashes it - checksumInstaller
 * depends on the installer task and does not run after a failure (#228) - but an empty jar sitting
 * in the distributions directory is one careless upload away from being released (#245).
 *
 * finalizedBy is the right shape here and the wrong shape for the checksums: a finalizer runs after
 * a FAILED target, which is precisely what has to be cleaned up, while a checksum must never be
 * written for a build that failed.
 *
 * The floor is a sanity floor, not the release policy floor. Anything below a megabyte cannot be
 * this installer - it packs an 80 MB uber jar - while the "is this a plausible release artifact"
 * question is a separate check with its own number in release-workflow.md, asked against the file
 * the checksums describe.
 */
tasks.register('discardBrokenInstaller') {
    description = "Removes an installer file that a failed build left behind."
    DirectoryProperty buildDirectoryProperty = layout.buildDirectory
    File installer = file("${buildDirectoryProperty.get()}/distributions/$rootProject.name-${projectVersion}-installer.jar")
    long sanityFloorInBytes = 1024 * 1024
    doLast {
        if (installer.exists() && installer.length() < sanityFloorInBytes) {
            long sizeInBytes = installer.length()
            if (installer.delete()) {
                logger.lifecycle("removed ${installer.name}: $sizeInBytes bytes cannot be an installer")
            } else {
                logger.warn("could not remove ${installer.name}, which is only $sizeInBytes bytes")
            }
        }
    }
}

izPackCreateInstaller.finalizedBy(discardBrokenInstaller)

// dependsOn, deliberately not finalizedBy: a finalizer also runs after its target FAILED, which
// wrote checksums for an installer a failed build had not produced. Depending on it instead means
// no checksum file exists unless the installer was built successfully (#228)
checksumInstaller.dependsOn(izPackCreateInstaller)
