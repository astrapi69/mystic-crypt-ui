// What every test JVM of a build may take, the same for the host and every plugin build (#580).
//
// 512 MB of heap is what Gradle gives a test JVM by default; it is written down so that it holds
// whatever a Gradle upgrade changes. Measured on 2026-10-17 with a GC log of every test JVM, every
// test task forced: the most any of them used was 290 MB (the host's e2e suite; its unit suite 288 MB,
// the password-hash plugin's 246 MB, every other plugin at most 212 MB), so 512 MB leaves 75 % above
// the largest need.
//
// One JVM at a time per test task, Gradle's default too: the UI suites need it, since they share one
// display (the own-display plugin), and each further fork of the unit suite would hold another
// 512 MB next to the daemon's.
//
// Applied by gradle/testing.gradle and by each plugin build, which is a Gradle build of its own.
//
// English, in the United States form, whatever the desktop speaks. The suites assert English text and
// English numbers; since a plugin carries German text (lethenon's messages_de.properties, #540), a JVM
// that took its language from a German desktop showed that text instead, and the same suite passed on
// CI and failed at home: 44 of the lethenon plugin's 241 tests under de_DE (#615). The language alone
// is not enough - with the desktop's country it becomes en_DE, which writes 1,25 for 1.25. A test that
// checks the German text sets its locale itself.
//
// The temporary directory: on Linux the JDK sets java.io.tmpdir to /tmp whatever TMPDIR says, and @TempDir,
// File.createTempFile and the libraries follow java.io.tmpdir. A release gate gives its runs TMPDIR on a disk with
// room (RL-124; the 8.7 gate probably died of a /tmp another program had filled, #522), so a TMPDIR the build was
// started with reaches every test JVM as java.io.tmpdir; without it the JDK's default stays.
tasks.withType(Test).configureEach {
    maxHeapSize = '512m'
    maxParallelForks = 1
    systemProperty 'user.language', 'en'
    systemProperty 'user.country', 'US'
    def temporaryDirectory = System.getenv('TMPDIR')
    if (temporaryDirectory) {
        systemProperty 'java.io.tmpdir', temporaryDirectory
    }
}

// A failed test prints its whole message and stack trace to the console. Without this Gradle shows
// only the exception class and the top frame - on CI, where the html and xml reports are not at hand,
// a failure like "NullPointerException at Preconditions.java:82" carries no information about where it
// came from, which makes a rarely failing test impossible to diagnose after the fact. The host's suites
// had it in testing.gradle; the plugin builds did not, so a failed assertEquals in a plugin test showed
// "AssertionFailedError at LethenonNodePanelBindingTest.java:127" without what the field held (#667).
// Here it reaches the host and every plugin build alike.
tasks.withType(Test).configureEach {
    testLogging {
        exceptionFormat = 'full'
        showStackTraces = true
        events 'failed'
    }
}
