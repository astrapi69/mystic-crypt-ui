// The suites are split by what they need, not by what they are called (#319).
//
// Gradle's build cache key covers a whole test task: its test classes and its whole runtime class
// path. So a split only saves a run when the suites also have separate CLASSES. Until #319 was done
// the end-to-end task read the same classes directory as the unit task, and one changed unit test
// invalidated every UI test with it. Measured in CI (#319): a pull request that changed no test
// input restored both suites FROM-CACHE in 3 seconds; the split below extends that to a change in a
// unit test, and to a change in one UI area not invalidating the others.
//
// The source sets, each its own directory and its own classes:
//   testSupport - what unit and UI tests share (TestPasswords, logging configuration)
//   test        - the unit tests, no display
//   e2eSupport  - the UI steps every end-to-end suite drives the application with
//   e2eKdbx     - the KDBX round trip against the file KeePassXC wrote, and its fixture
//   e2eLock     - locking, closing and ending the application
//   e2eTest     - every other end-to-end test
// A change to a support source set invalidates every suite that uses it, which is correct: the
// suites run through it. A change to the application itself invalidates all of them, also
// correctly - the end-to-end tests drive the whole application, so it is their input.
sourceSets {
    testSupport {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    test {
        compileClasspath += sourceSets.testSupport.output
        runtimeClasspath += sourceSets.testSupport.output
    }
    e2eSupport {
        compileClasspath += sourceSets.main.output + sourceSets.testSupport.output
        runtimeClasspath += sourceSets.main.output + sourceSets.testSupport.output
    }
    ['e2eKdbx', 'e2eLock', 'e2eTest'].each { suite ->
        create(suite) {
            compileClasspath += sourceSets.main.output + sourceSets.testSupport.output + sourceSets.e2eSupport.output
            runtimeClasspath += sourceSets.main.output + sourceSets.testSupport.output + sourceSets.e2eSupport.output
        }
    }
}

// every test source set gets the dependencies the unit tests have: the same libraries, the same
// Lombok, the same JUnit launcher
['testSupport', 'e2eSupport', 'e2eKdbx', 'e2eLock', 'e2eTest'].each { set ->
    configurations.named("${set}Implementation") { extendsFrom configurations.testImplementation }
    configurations.named("${set}RuntimeOnly") { extendsFrom configurations.testRuntimeOnly }
    configurations.named("${set}CompileOnly") { extendsFrom configurations.testCompileOnly }
    configurations.named("${set}AnnotationProcessor") { extendsFrom configurations.testAnnotationProcessor }
}

def e2eSuites = ['e2eTest', 'e2eLockTest', 'e2eKdbxTest']

// One display, one window manager, one system clipboard - and since the suites are separate tasks,
// Gradle runs them at the same time: the configuration cache lets tasks of one project execute in
// parallel. Measured on the first run of the split (#319): e2eTest, e2eLockTest and e2eKdbxTest
// interleaved in the log, and tests that pass alone failed, clicking into each other's windows and
// reading each other's clipboard. Every test task holds this service while it runs, so no two run
// at once. The unit suite holds it too: ClipboardClearWatchdogTest drives the real system clipboard.
abstract class OneDisplay implements org.gradle.api.services.BuildService<org.gradle.api.services.BuildServiceParameters.None> {
}
def oneDisplay = gradle.sharedServices.registerIfAbsent('oneDisplay', OneDisplay) {
    maxParallelUsages = 1
}
tasks.withType(Test).configureEach {
    usesService(oneDisplay)
}

test {
    useJUnitPlatform()
    // everything that does not need a display. No per-class fork: these tests share no singleton,
    // and a JVM start per class is most of their runtime
    filter {
        includeTestsMatching 'io.github.astrapi69.mystic.crypt.*'
        // a filter that matches nothing is an empty run reporting green, and an empty run is not a
        // clean result (quality-checks.md). This is the one place it can happen silently
        failOnNoMatchingTests = true
    }
    applyTestLogging(it)
}

// The end-to-end suites: the Swing tests, one task per source set so each has its own cache key.
[e2eTest: 'e2eTest', e2eLockTest: 'e2eLock', e2eKdbxTest: 'e2eKdbx'].each { taskName, setName ->
    tasks.register(taskName, Test) {
        description = "Runs the Swing end-to-end tests of src/${setName}. Needs Xvfb + fluxbox; see lessons-learned.md"
        group = 'verification'
        useJUnitPlatform()
        testClassesDirs = sourceSets[setName].output.classesDirs
        classpath = sourceSets[setName].runtimeClasspath
        filter {
            includeTestsMatching 'io.github.astrapi69.mystic.crypt.*'
            failOnNoMatchingTests = true
        }
        // three of the tests open this fixture by its path rather than from the class path, so it
        // is declared: an undeclared file is one the cache key would not see change
        inputs.file('src/test/resources/test-db.kdbx').withPropertyName('keePassFixture')
            .withPathSensitivity(PathSensitivity.NONE)
        // the AssertJ-Swing UI tests drive a process-wide singleton (MysticCryptApplicationFrame) and
        // register listeners on the static ApplicationEventBus; run each test class in its own fresh
        // JVM so that static/singleton state from one class cannot contaminate the next - this is
        // what makes the full UI suite pass, not just each test in isolation
        forkEvery = 1
        // a hang is a failure, not a wait. One focus race in AddEntryUiTest sat for 40 minutes with
        // no output and nothing to end it (#322); on a hosted runner that is six hours of nothing.
        // The limit is per test method and generous - the slowest of these drives a whole application
        systemProperty 'junit.jupiter.execution.timeout.testable.method.default', '3m'
        applyTestLogging(it)
        // after the fast one, so a failure that both would catch is reported by the cheap suite first
        shouldRunAfter test
    }
}

// print the whole stack trace of a failed test to the console. Without this Gradle shows only the
// top frame - on CI, where the html and xml reports are not at hand, a failure like
// "NullPointerException at Preconditions.java:82" carries no information about where it came from,
// which makes a rarely failing test impossible to diagnose after the fact
def applyTestLogging(Test task) {
    task.testLogging {
        exceptionFormat = 'full'
        showStackTraces = true
        events 'failed'
    }
}

// What ran, printed on success as well as on failure (#306).
//
// testLogging prints nothing when everything passes, so a green CI run said "BUILD SUCCESSFUL" and
// not how many tests produced it - every count in a pull request body came from a local run
// instead. Reading the XML is what the gate itself is told to do in quality-checks.md; this does it
// in the build rather than in somebody's terminal.
//
// A task rather than afterSuite: afterSuite is not compatible with the configuration cache, and
// this build uses it.
tasks.register('testSummary') {
    description = 'Prints what the test suites actually ran, from their result XML'
    group = 'verification'
    def resultDirs = ['test', 'e2eTest', 'e2eLockTest', 'e2eKdbxTest'].collect { layout.buildDirectory.dir("test-results/$it") }
    inputs.files(resultDirs.collect { it.map { dir -> dir.asFileTree.matching { include '**/TEST-*.xml' } } })
    doLast {
        def anyFound = false
        resultDirs.each { provider ->
            def dir = provider.get().asFile
            def files = dir.exists() ? dir.listFiles({ f -> f.name.startsWith('TEST-') && f.name.endsWith('.xml') } as FileFilter) : null
            if (files == null || files.length == 0) {
                return
            }
            anyFound = true
            int classes = 0, tests = 0, failures = 0, errors = 0, skipped = 0
            def ranNothing = []
            files.each { file ->
                def suite = new groovy.xml.XmlSlurper().parse(file)
                classes++
                int suiteTests = (suite.@tests.text() ?: '0') as int
                int suiteSkipped = (suite.@skipped.text() ?: '0') as int
                tests += suiteTests
                failures += (suite.@failures.text() ?: '0') as int
                errors += (suite.@errors.text() ?: '0') as int
                skipped += suiteSkipped
                if (suiteTests > 0 && suiteTests == suiteSkipped) {
                    ranNothing << suite.@name.text().tokenize('.').last()
                }
            }
            logger.lifecycle("${dir.name}: ${classes} classes, ${tests} tests, " +
                "${failures} failures, ${errors} errors, ${skipped} skipped")
            // a class whose every test is skipped ran nothing at all, and inside one total it
            // reads the same as a class that passed. That is how 43 plugin suites sat in a green
            // run unnoticed (#333)
            if (!ranNothing.isEmpty()) {
                logger.lifecycle("${dir.name}: ${ranNothing.size()} classes ran NO test - " +
                    "${ranNothing.sort().join(', ')}")
            }
        }
        if (!anyFound) {
            // an empty result set is not a clean result, it is a suite that never ran
            logger.lifecycle("test summary: no result files found - no suite wrote anything")
        }
    }
}

// A doLast line is the honest marker for "this suite ran in THIS build": an UP-TO-DATE or a
// FROM-CACHE task restores its result XML without executing a single test, and the summary above
// would then report the restored counts with nothing to say they are old (8.5's gate did exactly
// that). No line here, counts below restored.
tasks.named('test') {
    finalizedBy 'testSummary'
    doLast { logger.lifecycle('test: executed in this build') }
}
e2eSuites.each { suite ->
    tasks.named(suite) {
        finalizedBy 'testSummary'
        doLast { logger.lifecycle("${suite}: executed in this build") }
    }
    check.dependsOn suite
}

// pinned rather than left to whatever the Gradle version in use happens to bundle, so a coverage
// report is produced by a version somebody chose (#277)
jacoco {
    toolVersion = libs.versions.jacoco.version.get()
}

jacocoTestReport {
    // every suite, or the report silently loses whatever only the UI tests reach (#319)
    executionData.from files("$buildDir/jacoco/test.exec", "$buildDir/jacoco/e2eTest.exec",
        "$buildDir/jacoco/e2eLockTest.exec", "$buildDir/jacoco/e2eKdbxTest.exec").filter { it.exists() }
    dependsOn test, 'e2eTest', 'e2eLockTest', 'e2eKdbxTest'
    reports {
        xml.required.set(true)
        html.required.set(true)
    }
}

check.dependsOn jacocoTestReport
