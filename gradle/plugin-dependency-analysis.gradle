// The dependency-analysis plugin's settings for every internal plugin build, which applies this file after the
// plugin itself. It checks what gradle/dependency-analysis.gradle checks in the host: an unused dependency and an
// unused annotation processor.
//
// The plugin does not judge compileOnly declarations, and nearly everything a plugin compiles against is one: the
// host brings it at runtime. So this check does not see a compileOnly line nothing uses.

// The unused test dependencies that stay, per plugin build, each because javac needs it: a plugin's tests compile
// against its main classes, and javac reads the supertypes and signature types of those classes from the class path,
// although no test class file names them and the plugin counts only what the test class files name. Each line was
// measured by taking it out: the test compilation then fails (the runs of 2026-11-18, and of 2026-11-26 in GitHub
// Actions for checksum and keygen). The needed types are
//   org.pf4j.ExtensionPoint (every plugin build, so pf4j is excluded for all of them below),
//   swing-base-components: the supertype of the panels the tests build,
//   model-data: io.github.astrapi69.model.api.IModel, behind JMComboBox and the model-backed components,
//   crypt-api (certificate): Algorithm, bcpkix (OperatorCreationException; certificate, conversion, keygen,
//   keystore, pqc-signature), mystic-crypt (keystore, pqc-signature: brings crypt-api),
//   the host jar (conversion, keystore: PluginMenuContribution),
//   swing-table-components (lethenon, obfuscation: GenericTableModel).
// A plugin build with no entry has none. A new entry names the type javac needs; it is not a place for a dependency
// that is merely unproven.
def keptUnusedDependencies = [
    "certificate-plugin"   : ["org.bouncycastle:bcpkix-jdk18on", "io.github.astrapi69:crypt-api"],
    "checksum-plugin"      : ["io.github.astrapi69:model-data", "io.github.astrapi69:swing-base-components"],
    "conversion-plugin"    : ["io.github.astrapi69:mystic-crypt-ui", "org.bouncycastle:bcpkix-jdk18on",
                              "io.github.astrapi69:swing-base-components"],
    "keygen-plugin"        : ["org.bouncycastle:bcpkix-jdk18on", "io.github.astrapi69:model-data",
                              "io.github.astrapi69:swing-base-components"],
    "keystore-plugin"      : ["io.github.astrapi69:mystic-crypt-ui", "org.bouncycastle:bcpkix-jdk18on",
                              "io.github.astrapi69:mystic-crypt", "io.github.astrapi69:swing-base-components"],
    "lethenon-plugin"      : ["io.github.astrapi69:swing-table-components"],
    "obfuscation-plugin"   : ["io.github.astrapi69:swing-base-components",
                              "io.github.astrapi69:swing-table-components"],
    "pqc-signature-plugin" : ["org.bouncycastle:bcpkix-jdk18on", "io.github.astrapi69:mystic-crypt"],
]

// "fail", as in the host (gradle/dependency-analysis.gradle): the last pull requests of the decision of 2026-11-18 are
// merged (#1197, #1200)
def unusedDependencySeverity = "fail"

dependencyAnalysis {
    // A plugin build is an application: the host loads its zip, and nothing compiles against it. The plugin
    // analyzes a project that applies only `java` when it is told it is one; without app() it registers no
    // analysis at all, and buildHealth reports "No project health reports found" with a green build
    app()
    structure {
        // junit-jupiter is the aggregate the JUnit User Guide recommends: the tests compile against its api and
        // params modules and run on the engine it brings, which nothing names directly
        bundle("junit-jupiter") {
            primary(libs.junit.jupiter)
            includeGroup("org.junit.jupiter")
        }
    }
    issues {
        all {
            onUnusedDependencies {
                severity(unusedDependencySeverity)
                // javac needs it for ExtensionPoint, in every plugin build (see above)
                exclude("org.pf4j:pf4j")
                exclude(*(keptUnusedDependencies[rootProject.name] ?: []))
            }
            onUnusedAnnotationProcessors {
                severity(unusedDependencySeverity)
                // pf4j's processor is used: it writes META-INF/extensions.idx, from which the host finds every
                // extension of the plugin. The plugin reports it as unused because nothing in the sources calls it;
                // the console plugin compiled without it wrote no extensions.idx at all (measured 2026-11-18)
                exclude("org.pf4j:pf4j")
            }
        }
    }
}
