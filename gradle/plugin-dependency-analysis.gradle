// The dependency-analysis plugin's settings for every internal plugin build, which applies this file after the
// plugin itself. It checks what gradle/dependency-analysis.gradle checks in the host: an unused dependency and an
// unused annotation processor.
//
// The plugin does not judge compileOnly declarations, and nearly everything a plugin compiles against is one: the
// host brings it at runtime. So this check does not see a compileOnly line nothing uses.

// The findings reported on 2026-11-18, when the check was introduced, and not decided yet, per plugin build. Each
// goes with the pull request that removes it or says why it stays, so the lists only get shorter. Many of the test
// dependencies here are not unused: javac needs them for the types of the main classes the tests compile against.
// Such a type is a supertype or a signature type that no test class file names, and the plugin counts only what the
// test class files name.
def pendingUnusedDependencies = [
    "certificate-plugin"   : ["org.bouncycastle:bcpkix-jdk18on", "io.github.astrapi69:crypt-api",
                              "io.github.astrapi69:model-data", "org.pf4j:pf4j",
