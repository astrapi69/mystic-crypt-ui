license {
    ext.year="$projectInceptionYear"
    ext.owner="$projectLeaderName"
    ignoreFailures = true
    header = rootProject.file("src/main/resources/LICENSE.txt")
}

// The header belongs on this project's own Java sources and on nothing else.
//
// It is stated here rather than through the extension's excludes on purpose: those are wired into
// the tasks through Gradle's conventionMapping, which does not reach SourceTask.getExcludes() - so
// every pattern configured there was accepted and silently did nothing. licenseFormat therefore
// stamped resources it was told to skip: help files, .bat launchers, a third party's licence text,
// messages.properties, and src/test/resources/spotless/importorder.properties - the last of which
// is Spotless's own configuration, after which the build could no longer configure itself at all
// ("For input string: \"\"" out of :spotlessJava, naming neither the file nor licenseFormat) (#282).
//
// An include on the task's own pattern set is applied directly, which is the mechanism that works.
// The tasks read allSource, so resources are in scope by default and have to be filtered out here.
tasks.matching { it instanceof SourceTask && it.name.startsWith("license") }.configureEach {
    include "**/*.java"
}

// workhack for license issue #76: the check tasks are permanently disabled (licenseFormat stays
// available). Disabling the tasks directly (instead of the previous startParameter exclusion)
// also works with the configuration cache, where the license plugin's execution-time
// Task.project access would otherwise fail the build
tasks.matching { it.name == "licenseMain" || it.name == "licenseTest" }.configureEach {
    enabled = false
}
