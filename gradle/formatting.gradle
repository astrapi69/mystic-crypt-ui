spotless {

    format "misc", {
        // define the files to apply `misc` to
        target "*.gradle", "*.md", ".gitignore"

        // define the steps to apply to those files
        trimTrailingWhitespace()
        leadingTabsToSpaces() // or spaces. Takes an integer argument if you don"t like 4
        endWithNewline()
    }
    java {
        // export config file:
        // https://github.com/diffplug/spotless/blob/main/ECLIPSE_SCREENSHOTS.md#creating-spotlessimportorder
        importOrderFile('src/test/resources/spotless/importorder.properties')
        // removes any unused imports
        removeUnusedImports()
        // import order file as exported from eclipse
        eclipse("4.21").configFile("src/test/resources/spotless/alpharo-formatter.xml")
        // the MIT header on every Java source of the build, written and checked here since #686 (the license
        // plugin it replaces had its checks disabled and brought plexus-utils and spring-core 3.1.3 along)
        licenseHeaderFile(rootProject.file("src/test/resources/spotless/license-header.txt"))
    }
}
