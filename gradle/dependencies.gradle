dependencies {

    izpack libs.izpack.ant

    compileOnly libs.lombok
    annotationProcessor libs.lombok
    testCompileOnly libs.lombok
    testAnnotationProcessor libs.lombok

    implementation libs.miglayout.swing
    implementation libs.guava
    implementation libs.lgood.date.picker
    implementation libs.javahelp
    implementation libs.pf4j
    implementation libs.commons.lang3
    implementation libs.bcprov.jdk18on
    implementation libs.bcpkix.jdk18on
    implementation libs.tango.icon.theme
    implementation libs.observer
    implementation libs.state.pattern
    implementation libs.eventbus
    implementation libs.visitor
    implementation libs.icon.img.extensions
    implementation libs.jremix.icon
    implementation libs.silk.icon.theme
    implementation libs.silly.collection
    implementation libs.silly.bean
    implementation libs.commons.codec
    implementation libs.checksum.up
    // mystic-crypt brings crypt-api, silly-bean and bouncycastle along as api dependencies, and
    // they are not pinned again here
    implementation libs.mystic.crypt
    // crypt-data is, although mystic-crypt brings it too: this application is what puts crypt-data
    // on the plugins' class path at run time, and the plugins read key files through
    // AnyKeyFileReader, which is newer (13.1) than the crypt-data mystic-crypt 13.4 was built
    // against (13.0). Inherited quietly, the plugins would compile against one version and run
    // against an older one - a NoClassDefFoundError the first time a key file is opened. One
    // catalog entry for the host and every plugin, instead of the literals two plugins carried
    // (#490)
    implementation libs.crypt.data
    // the library brings picocli only at runtime scope; the command line entry point of this
    // application compiles against it, so it is declared here with the very same version
    implementation libs.picocli
    implementation libs.model.data
    implementation libs.throwable
    implementation libs.file.worker
    implementation libs.jobj.core
    implementation libs.silly.io
    implementation libs.swing.components
    implementation libs.swing.renderer
    implementation libs.flatlaf
    implementation libs.component.model
    implementation libs.swing.base.components
    implementation libs.swing.tree.component
    implementation libs.swing.splashscreen
    implementation libs.swing.table.components
    implementation libs.menu.action
    implementation libs.net.extensions
    implementation libs.gen.tree
    implementation libs.gson
    implementation libs.jobj.copy
    implementation libs.data.api
    implementation libs.id.generate
    implementation libs.xml.extensions
    implementation libs.xstream
    implementation libs.gson.extensions
    implementation libs.xstream.extensions
    implementation libs.resourcebundle.core
    implementation libs.tree.api
    implementation libs.jobj.cloner
    implementation libs.awt.extensions
    implementation libs.swing.model.components
    implementation libs.swing.wizard
    implementation libs.kee.pass.java2.jackson
    // randomizer is no dependency of this application since #658: its random values come from
    // SecureRandom. Before 10.5 its default generator is seeded with the current time
    // (GHSA-395w-fmf5-xfj3). Since #682 nothing here asks for such a version any more: roboter 3,
    // through swing-tree-component 3.3, brings 10.7, and swing-components 10 brings none. The
    // constraint stays as a second guard, so that a library which brought an old version back would
    // still ship a safe one, and RuntimeDependenciesTest proves the floor
    constraints {
        implementation(libs.randomizer) {
            because 'randomizer before 10.5 seeds its default generator with the current time'
        }
        // jettison is no dependency of this application either: xml-extensions 8.2 brings it through
        // xstream-extensions 1.1 at 1.5.1, which has four high advisories (GHSA-x27m-9w8j-5vcw,
        // GHSA-grr4-wv38-f68w, GHSA-7rf3-mqpx-h7xg, GHSA-q6g2-g7f3-rr83). No code here reaches it, the
        // installer ships it all the same (#684). Goes when xstream-extensions brings a fixed version
        // (astrapi69/xstream-extensions#15); RuntimeDependenciesTest proves the floor
        implementation(libs.jettison) {
            because 'jettison before 1.5.4 has four high advisories'
        }
    }
    // Libraries log through the Log4j API and commons-logging; this keeps both routed to SLF4J, as
    // they were while resource-viewmodels brought this bridge with Spring Boot. Without it, the
    // Log4j API falls back to its SimpleLogger and commons-logging follows it: library errors and a
    // StatusLogger complaint on stderr, where there was nothing before (measured, #639)
    runtimeOnly libs.log4j.to.slf4j

    // Note: use of bundles...
    testImplementation libs.bundles.unit.testing
    testRuntimeOnly libs.junit.platform.launcher

    // mutation testing (see gradle/mutation-testing.gradle)
    pitest libs.pitest.junit5.plugin
}
