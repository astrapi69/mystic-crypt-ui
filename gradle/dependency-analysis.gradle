// What the dependency-analysis plugin (com.autonomousapps.dependency-analysis) checks in the host build: a declared
// dependency nothing uses, and an unused annotation processor. `make dependency-analysis` runs it for the host and
// every plugin build, and CI runs that target on every push. The plugin's other advice is printed and never enforced:
// transitive dependencies to declare directly, api against implementation, and a dependency to move to runtimeOnly.
// The last one is also how the plugin reports an unused dependency that brings a service file (measured with
// jackson-databind on 2026-11-18), so such a dependency is not caught here.

// Report only, until the last group of removals is merged (the maintainer's decision of 2026-11-18): no pull request
// may turn red through this check while the findings of 2026-11-18 are still being removed or decided. The pull
// request that empties the exclusion lists below and in gradle/plugin-dependency-analysis.gradle sets both to "fail"
def unusedDependencySeverity = "warn"

dependencyAnalysis {
    structure {
        // junit-jupiter is the aggregate the JUnit User Guide recommends: the tests compile against its api and
        // params modules and run on the engine it brings, which nothing names directly
        bundle("junit-jupiter") {
            primary(libs.junit.jupiter)
            includeGroup("org.junit.jupiter")
        }
    }
    issues {
        all {
            onUnusedDependencies {
                severity(unusedDependencySeverity)
                // Reported on 2026-11-18, when the check was introduced, and not decided yet. Each goes with the
                // pull request that removes it or says why it stays, so this list only gets shorter, and what the
                // report still shows is new
                exclude("commons-codec:commons-codec", "com.google.code.gson:gson",
                    "io.github.astrapi69:jobj-cloner", "io.github.astrapi69:jobj-copy", "io.github.astrapi69:jremix-icon",
                    "io.github.astrapi69:silk-icon-theme",
                    "org.freedesktop.tango:tango-icon-theme", "io.github.astrapi69:tree-api",
                    "io.github.astrapi69:junit-jupiter-extensions",
                    "org.mockito:mockito-core")
            }
            onUnusedAnnotationProcessors {
                severity(unusedDependencySeverity)
            }
        }
    }
}
