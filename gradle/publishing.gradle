
def releaseVersion = !version.endsWith("SNAPSHOT")

task sourcesJar(type: Jar) {
    archiveClassifier.set("sources")
    from(sourceSets.main.allJava)
}

task javadocJar(type: Jar) {
    from javadoc
    archiveClassifier.set("javadoc")
    javadoc {
        failOnError = false
    }
}

javadoc {
    failOnError = false
    if(JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption("html5", true)
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "$rootProject.name"
            from components.java
            artifact sourcesJar
            artifact javadocJar
            pom {
                name = "$rootProject.name"
                description = "$projectDescription"
                url = "$projectScmProviderUrl"+"$projectHolderUsername"+"$slash"+"$rootProject.name"
                organization {
                    name = "$projectOrganizationName"
                    url = "$projectOrganizationUrl"
                }
                issueManagement {
                    system = "$projectIssueManagementSystem"
                    url = "$projectScmProviderUrl"+"$projectHolderUsername"+"$slash"+"$rootProject.name"+"$issuesPath"
                }
                licenses {
                    license {
                        name = "$projectLicenseName"
                        url = "$projectLicenseUrl"
                        distribution = "$projectLicenseDistribution"
                    }
                }
                developers {
                    developer {
                        id = "$projectHolderUsername"
                        name = "$projectLeaderName"
                    }
                }
                scm {
                    connection = "$projectScmGitUrlPrefix" + "$projectScmProviderDomain" + "$colon" + "$projectHolderUsername" + "$slash" + "$rootProject.name" + "$projectScmGitUrlSuffix"
                    developerConnection = "$projectScmGitUrlPrefix" + "$projectScmProviderDomain" + "$colon" + "$projectHolderUsername" + "$slash" + "$rootProject.name" + "$projectScmGitUrlSuffix"
                    url = "$projectScmGitUrlPrefix" + "$projectScmProviderDomain" + "$colon" + "$projectHolderUsername" + "$slash" + "$rootProject.name" + "$projectScmGitUrlSuffix"
                }
            }
        }
    }
    repositories {
        maven {
            if (releaseVersion) {
                // the credentials come from the environment or the developer's private
                // gradle.properties; a build that only compiles and tests a release version - CI,
                // a fresh clone - has neither, and must not fail at configuration time for that
                credentials {
                    username System.getenv("$projectRepositoriesUserNameKey") ?: project.findProperty("$projectRepositoriesUserNameKey")
                    password System.getenv("$projectRepositoriesPasswordKey") ?: project.findProperty("$projectRepositoriesPasswordKey")
                }
            }
            def releasesRepoUrl = "$projectRepositoriesReleasesRepoUrl" as Object
            def snapshotsRepoUrl = "$projectRepositoriesSnapshotsRepoUrl" as Object
            url = releaseVersion ? releasesRepoUrl : snapshotsRepoUrl
        }
    }
}

// Signing a release publication, without making every build that publishes LOCALLY need the key.
//
// The signing keys live in the maintainer's private gradle.properties and nowhere else. Since #333
// the CI workflow builds the plugins, which needs the host in the local Maven repository, so every
// CI build runs publishToMavenLocal - and on a release version that pulled in signMavenJavaPublication,
// which failed with "No configured signatory" before a single test ran. A version bump could not
// pass CI at all (#431).
//
// So: a LOCAL publish without a signatory signs nothing and says so, the way the jar signing next
// door already behaves. A publish to the REMOTE repository without a signatory still fails - an
// unsigned artifact on a public repository is not the smaller problem.
def publishesToTheRemoteRepository = gradle.startParameter.taskNames.any { name ->
    name.contains('publish') && !name.contains('ToMavenLocal')
}
def signatoryConfigured = ['signing.keyId', 'signing.password', 'signing.secretKeyRingFile']
        .every { project.hasProperty(it) } || project.hasProperty('signing.gnupg.keyName')

signing {
    required = { releaseVersion && publishesToTheRemoteRepository }
    if (releaseVersion) {
        sign publishing.publications.mavenJava
        if (!signatoryConfigured && !publishesToTheRemoteRepository) {
            println('No signing key configured, the published artifacts are not signed.\n' +
                    'Set the signing.* properties to sign them.')
        }
    }
}
