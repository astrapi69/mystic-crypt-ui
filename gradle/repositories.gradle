repositories {
    mavenLocal()
    mavenCentral()
    /**
     * Snapshots of the family's libraries, lethenon among them. Releases come from mavenCentral();
     * the releases repository that stood here named the shut-down OSSRH staging endpoint (#453)
     **/
    maven {
        name = "$projectRepositoriesSnapshotsName"
        url = "$projectRepositoriesSnapshotsRepoUrl"
        mavenContent {
            snapshotsOnly()
        }
    }
}

// A snapshot is a changing module, and Gradle trusts its cached copy of one for 24 hours unless told
// otherwise. CI restores the Gradle home from the Actions cache, so it built against a lethenon
// snapshot from before the one on Central and could not find classes the code uses (#464). The only
// changing module in the version catalog is lethenon, which e2eTest compiles against, so this asks
// the repository again for that one module and for nothing else.
configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}
