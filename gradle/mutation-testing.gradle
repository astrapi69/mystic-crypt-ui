// Mutation testing with PIT.
//
// Scoped on purpose: only the classes that carry logic, never the Swing user interface. PIT reruns
// the covering tests for every single mutation, and this project's user interface tests are
// AssertJ-Swing end-to-end tests that need a display and take minutes for one full run - mutating
// against them would take hours. On top of that, mutations in layout and wiring code are usually
// equivalent, so they produce noise instead of insight.
//
// What stays in scope are the headless, fast tests: the menu layout, the KeePass converters, the
// settings including the store behind the per-plugin configuration, the workspace and idle
// lock decisions, and what closing a vault does to the model. The last one is here on purpose: it decides whether a locked workspace shows its vault,
// which is the defect #237 was, and it was extracted out of the Swing frame precisely so that this
// exclusion stops applying to it (#252).
//
// Measured and left out again for the same reason the user interface is left out:
// PluginSettingsPanel is a Swing panel - almost all of its mutations hit setName/add/setText calls
// that no assertion can see - and MysticCryptUiCli is plumbing around the pf4j plugin manager,
// whose loadPlugins/startPlugins/stopPlugins calls only become observable with plugin zips actually
// installed, which a mutation run does not have. Both are covered by their own tests
// (PluginSettingsPanelTest, MysticCryptUiCliTest); they just make poor mutation targets.
//
// Left out for now, to be added once their tests stand on their own: the application file format in
// ...crypt.app and the KdbxCreds round trip. Their tests read keys that only parse with a security
// provider and with fixtures another test class prepares, so they pass in a full suite run but not
// when PIT runs them in its own forked JVM. That is a real coupling in those tests, not a PIT
// problem - PIT just makes it visible.
//
// IdleLockWatchdog keeps a handful of surviving mutants in start() and stop(), and they stay:
// what is left there is a javax.swing.Timer and a Toolkit listener registration, which is the
// same Swing wiring this scope excludes everywhere else. Its DECISION is measured -
// checkNow() is package visible and driven over an injected clock, so "locks after the
// timeout", "does not lock twice" and "never locks when switched off" are real assertions
// rather than a timer nobody waits for.
//
// Run it with `./gradlew pitest`; the report lands in build/reports/pitest. There is deliberately
// One mutant in MenuLayoutSupport.harvestActions survives on purpose and cannot be killed: turning
// `index < menuBar.getMenuCount()` into `<=` makes getMenu(count) return null, which the null guard
// right below already handles - the behaviour is identical, so it is an equivalent mutant.
//
// There is deliberately no mutationThreshold yet - a threshold picked before the first measurement would either fail the
// build for no reason or be meaningless. Measure first, then set it just below what was reached, so
// it guards against regressions.
pitest {
    junit5PluginVersion = libs.versions.pitest.junit5.plugin.version.get()
    pitestVersion = libs.versions.pitest.version.get()
    targetClasses = [
            "io.github.astrapi69.mystic.crypt.menu.*",
            "io.github.astrapi69.mystic.crypt.lock.*",
            "io.github.astrapi69.mystic.crypt.vault.*",
            "io.github.astrapi69.mystic.crypt.keepass.KeePassEntryConverter",
            "io.github.astrapi69.mystic.crypt.keepass.KeePassTreeConverter",
            "io.github.astrapi69.mystic.crypt.settings.MysticCryptSettings",
            "io.github.astrapi69.mystic.crypt.settings.PluginSettings"
    ]
    // only the headless tests - excludes the whole ...crypt.ui package with its Swing tests, and
    // excludes the root-package PluginMenuOrderTest, which is deliberately a DesktopMenu/JMenu
    // wiring test rather than a test of PluginMenuOrder's own ordering decision
    targetTests = [
            "io.github.astrapi69.mystic.crypt.menu.*",
            "io.github.astrapi69.mystic.crypt.lock.*",
            "io.github.astrapi69.mystic.crypt.vault.*",
            "io.github.astrapi69.mystic.crypt.keepass.KeePassEntryConverterTest",
            "io.github.astrapi69.mystic.crypt.keepass.KeePassTreeConverterTest",
            "io.github.astrapi69.mystic.crypt.settings.MysticCryptSettingsTest",
            "io.github.astrapi69.mystic.crypt.settings.PluginSettingsTest"
    ]
    threads = 4
    // the set is named, not left to PIT, because a run that does not say which set it used cannot be
    // compared with another one (#589). These eleven are what every run so far measured: the set PIT
    // 1.30.0 takes when none is named (Mutator.newDefaults()). It is not the group DEFAULTS, which has
    // REMOVE_CONDITIONALS_ORDER_ELSE and REMOVE_CONDITIONALS_EQUAL_ELSE where this has
    // NEGATE_CONDITIONALS - measured: naming DEFAULTS turned 15 killed mutants into survivors. Moving
    // to DEFAULTS or STRONGER is a step of its own, with a new baseline
    mutators = ["INVERT_NEGS", "MATH", "VOID_METHOD_CALLS", "NEGATE_CONDITIONALS", "CONDITIONALS_BOUNDARY",
                "INCREMENTS", "TRUE_RETURNS", "FALSE_RETURNS", "PRIMITIVE_RETURNS", "EMPTY_RETURNS",
                "NULL_RETURNS"]
    outputFormats = ["HTML", "XML"]
    timestampedReports = false
}

// mutation-context.json next to the report (#589): what a run measured - tool and version, mutators,
// scope, the breakdown, score and test strength, commit and date - in the form awesome-well-tested
// specifies (docs/mutation-context.md and its JSON Schema there), so that runs and repositories can be
// compared. awesome-well-tested's converter writes it; mutation.yml fetches the converter pinned to a
// commit and names it with -PmutationContextConverter. Version, mutators and targets come from the
// pitest block above, so nothing here repeats them. The scope is an allow list: nothing is excluded
// from within the targets, so no --exclude is passed.
tasks.register('mutationContext', Exec) {
    description = 'Writes build/reports/pitest/mutation-context.json from the last pitest run (#589)'
    def converter = providers.gradleProperty('mutationContextConverter')
    def report = layout.buildDirectory.file('reports/pitest/mutations.xml')
    def context = layout.buildDirectory.file('reports/pitest/mutation-context.json')
    def mutatorSet = pitest.mutators
    def targets = pitest.targetClasses
    def toolVersion = libs.versions.pitest.version.get()
    executable = 'python3'
    argumentProviders.add({
        if (!converter.isPresent()) {
            throw new GradleException('mutationContext needs awesome-well-tested\'s converter: ' +
                    '-PmutationContextConverter=<path to scripts/mutation_context.py> (#589)')
        }
        List<String> arguments = [converter.get(), '--pit', report.get().asFile.path,
                                  '--tool-version', toolVersion, '--out', context.get().asFile.path]
        mutatorSet.get().each { arguments.addAll(['--mutators', it]) }
        targets.get().each { arguments.addAll(['--target', it]) }
        return arguments
    } as CommandLineArgumentProvider)
    mustRunAfter 'pitest'
}
