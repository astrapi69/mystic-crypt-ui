import java.text.SimpleDateFormat
def mainClassName = project.property('mainClass')
def releaseVersion = !version.endsWith("SNAPSHOT")
def createIzPackInstaller = project.property('createIzPackInstaller').toBoolean()

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        // the lethenon plugin's sqlite-jdbc loads its native library with System::load, which JDK 25
        // allows with a warning and a future release blocks unless native access is enabled; the
        // launchers start this jar with java -jar, where this attribute is the switch (#581)
        attributes("Enable-Native-Access": "ALL-UNNAMED")
        // Manifest-Version is the version of the manifest format, 1.0, which Gradle writes; the
        // application's version is Implementation-Version, and a Name belongs to a per-entry section
        // (#783)
        attributes(
                "Main-Class"            : mainClassName,
                "Implementation-Title"  : "$groupPackage" + "." + "$rootProject.name",
                "Implementation-Version": project.version,
                "Implementation-Vendor" : "$projectLeaderName",
                "Created-By"            : "Gradle ${gradle.gradleVersion}",
                "Built-By"              : "$projectLeaderName",
                "Build-Timestamp"       : new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSSZ").format(new Date()),
                "Build-Jdk"             : "${System.properties['java.version']} (${System.properties['java.vendor']} ${System.properties['java.vm.version']})",
                "Build-OS"              : "${System.properties['os.name']} ${System.properties['os.arch']} ${System.properties['os.version']}")
    }
}

// the signing block below reaches for script objects (layout, project.property, ant) at
// execution time, which the configuration cache forbids - opt this task out instead of
// failing the whole build
jar.notCompatibleWithConfigurationCache(
        "jar signing doLast uses script objects at execution time")

// The keystore's two passwords: from the environment of the one command that signs, which
// scripts/with-signing-passwords.sh fills from the desktop's keyring (#579), else from the
// release.mystic-crypt.* properties in ~/.gradle/gradle.properties, where they were before. The
// build says which source it used, never the value.
def signingPassword = { String variable, String property ->
    String fromEnvironment = System.getenv(variable)
    if (fromEnvironment != null && !fromEnvironment.isEmpty()) {
        println("signing: the ${property} comes from the environment variable ${variable}")
        return fromEnvironment
    }
    if (project.hasProperty(property)) {
        println("signing: the ${property} comes from the property ${property}")
        return project.property(property)
    }
    return null
}

jar.doLast {
    DirectoryProperty buildDirectoryProperty = layout.buildDirectory
    String buildDirectory = buildDirectoryProperty.get()
    // the keystore lives on the developer's machine, never in the repository - so a release
    // version built without it (CI, a fresh clone, a contributor's machine) says so and produces an
    // unsigned jar. An installer build does not: it packs the signed jar, and an installer without
    // a signature is refused here instead of being written (#579)
    def wantsSigning = releaseVersion || createIzPackInstaller
    def storePassword = wantsSigning ? signingPassword('MYSTIC_CRYPT_STORE_PASSWORD', "$mysticCryptStorePassword") : null
    def keyPassword = wantsSigning ? signingPassword('MYSTIC_CRYPT_KEY_PASSWORD', "$mysticCryptKeyPassword") : null
    def signingConfigured = storePassword != null && keyPassword != null &&
            [mysticCryptKeyAlias, mysticCryptStoreFile, mysticCryptStoreType].every { project.hasProperty(it) }
    if (createIzPackInstaller && !signingConfigured) {
        throw new GradleException('not signed: an installer build needs the release keystore - the ' +
                'release.mystic-crypt.* properties for its file, type and alias, and its two passwords ' +
                'from the keyring through scripts/with-signing-passwords.sh (make izpack-installer ' +
                'does that) or from the properties (#579)')
    }
    if (wantsSigning && !signingConfigured) {
        println('No signing configuration found, the created jar file is not signed.\n' +
                'Set the release.mystic-crypt.* properties to sign it.')
    }
    if (wantsSigning && signingConfigured) {
        def pkAlias = project.property("$mysticCryptKeyAlias")
        def keystoreFileName = project.property("$mysticCryptStoreFile")
        def keystoreType = project.property("$mysticCryptStoreType")
        def libsFilePath = "$buildDirectory/libs"
        def libFiles = files { file(libsFilePath).listFiles() }
        def destDir = "$buildDirectory/signed"
        def signedDir = new File(destDir)
        signedDir.mkdirs()
        libFiles.each {
            ant.signjar(
                    jar: 'build/libs/*.jar',
                    destDir: "$destDir",
                    alias: "$pkAlias",
                    storetype: "$keystoreType",
                    keystore: "$keystoreFileName",
                    storepass: "$storePassword",
                    keypass: "$keyPassword",
                    verbose: true,
                    preservelastmodified: "true"
            )
        }
    } else {
        println('Created jar file is not signed.\n' +
                'IzPackInstaller can not be created because it depends on signed jar.')
    }
}

/**
 * Names the version of every module the all-dependencies jar is packed from, one line
 * group:artifact=version, in META-INF/mystic-crypt-ui/runtime-versions.txt inside that jar
 * (#769). The family's libraries are built with Gradle and carry no pom.properties, and the jar keeps
 * no library's own manifest, so without this list the version of a shipped library could not be
 * read from the jar at all. It is taken from the same resolved artifacts the jar is packed from, so
 * it names exactly what is in it; RuntimeDependenciesTest reads it with -PapplicationJarUnderTest. A text
 * file and not a .properties one: a colon would end a properties key
 */
def runtimeVersionsDirectory = layout.buildDirectory.dir('generated/runtime-versions')
tasks.register('runtimeVersions') {
    description = 'Writes the version of every module of the runtime class path, for the all-dependencies jar.'
    def versions = configurations.runtimeClasspath.incoming.artifacts.resolvedArtifacts.map { artifacts ->
        artifacts.collect { it.id.componentIdentifier }
                .findAll { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
                .collect { "${it.group}:${it.module}=${it.version}".toString() }
                .unique()
                .sort()
    }
    inputs.property('versions', versions)
    outputs.dir(runtimeVersionsDirectory)
    doLast {
        // the directory holds this list and nothing else: whatever an earlier run left there would be
        // packed into the jar with it
        runtimeVersionsDirectory.get().asFile.deleteDir()
        File list = runtimeVersionsDirectory.get().file('META-INF/mystic-crypt-ui/runtime-versions.txt').asFile
        list.parentFile.mkdirs()
        list.setText(versions.get().join('\n') + '\n', 'UTF-8')
    }
}

/**
 * The licence and notice files of a library: at its root, at the top of its META-INF and under its
 * license directory. A file of such a name inside a package is a resource of the library's code and
 * stays where the code looks for it
 */
def thirdPartyLegalFiles = ['LICENSE*', 'NOTICE*', 'META-INF/*LICENSE*', 'META-INF/*NOTICE*',
                            'META-INF/COPYING*', 'META-INF/DEPENDENCIES*', 'META-INF/AUTHORS*', 'license/**']

/**
 * Copies the licence and notice files of every library of the runtime class path to
 * META-INF/third-party/<group>/<artifact>/, as the library carries them (#779). The libraries share
 * these paths - 27 carry a META-INF/NOTICE, in eight different texts - and the all-dependencies jar
 * keeps one copy of each path, so it kept the first library's and dropped Jackson's, Batik's and
 * Apache Commons' notices, which the Apache License 2.0 asks a redistribution to carry. The
 * installer ships nothing else but that jar; SharedLibraryFilesTest checks it
 */
abstract class ThirdPartyLegalFiles extends DefaultTask {
    /** group/artifact of each library, and its file */
    @Input
    abstract MapProperty<String, String> getLibraries()

    @InputFiles
    @PathSensitive(PathSensitivity.NONE)
    abstract ConfigurableFileCollection getLibraryFiles()

    @Input
    abstract ListProperty<String> getLegalFiles()

    @OutputDirectory
    abstract DirectoryProperty getDestination()

    @Inject
    abstract ArchiveOperations getArchives()

    @Inject
    abstract FileSystemOperations getFileSystem()

    @TaskAction
    void copy() {
        File directory = destination.get().asFile
        fileSystem.delete { it.delete(directory) }
        libraries.get().each { String module, String library ->
            fileSystem.copy {
                it.from(archives.zipTree(library)) { it.include(legalFiles.get()) }
                it.into(new File(directory, "META-INF/third-party/${module}"))
                it.includeEmptyDirs = false
            }
        }
    }
}

def thirdPartyLegalFilesDirectory = layout.buildDirectory.dir('generated/third-party-legal-files')
tasks.register('thirdPartyLegalFiles', ThirdPartyLegalFiles) {
    description = 'Copies the licence and notice files of every runtime library, for the all-dependencies jar.'
    libraries = configurations.runtimeClasspath.incoming.artifacts.resolvedArtifacts.map { artifacts ->
        artifacts.findAll { it.id.componentIdentifier instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
                .collectEntries { ["${it.id.componentIdentifier.group}/${it.id.componentIdentifier.module}".toString(),
                                   it.file.absolutePath] }
    }
    libraryFiles.from(configurations.runtimeClasspath)
    legalFiles = thirdPartyLegalFiles
    destination = thirdPartyLegalFilesDirectory
}

/**
 * Merges the service files of every library of the runtime class path and of the application into
 * META-INF/services/, every provider once, in class path order (#776). The all-dependencies jar keeps
 * one copy of each path, so of a service several libraries provide it kept the first library's
 * providers: of com.fasterxml.jackson.core.JsonFactory only jackson-dataformat-xml's XmlFactory,
 * without jackson-core's JsonFactory and jackson-dataformat-yaml's YAMLFactory. Comments and blank
 * lines are left out, as ServiceLoader reads them; SharedLibraryFilesTest checks the jar
 */
abstract class MergedServiceFiles extends DefaultTask {
    /** the libraries, then the application's own output, in that order */
    @InputFiles
    @Classpath
    abstract ConfigurableFileCollection getSources()

    @OutputDirectory
    abstract DirectoryProperty getDestination()

    @TaskAction
    void merge() {
        Map<String, Set<String>> providers = new TreeMap<>()
        sources.files.each { File source ->
            if (source.isDirectory()) {
                File services = new File(source, 'META-INF/services')
                services.listFiles()?.findAll { it.isFile() }?.sort { it.name }?.each { File file ->
                    add(providers, file.name, file.getText('UTF-8'))
                }
            } else if (source.isFile()) {
                new java.util.zip.ZipFile(source).withCloseable { archive ->
                    archive.entries().toList().findAll { entry ->
                        !entry.directory && entry.name ==~ /META-INF\/services\/[^\/]+/
                    }.each { entry ->
                        add(providers, entry.name.substring('META-INF/services/'.length()),
                                archive.getInputStream(entry).getText('UTF-8'))
                    }
                }
            }
        }
        File directory = destination.get().asFile
        directory.deleteDir()
        File services = new File(directory, 'META-INF/services')
        services.mkdirs()
        providers.each { String service, Set<String> names ->
            new File(services, service).setText(names.join('\n') + '\n', 'UTF-8')
        }
    }

    static void add(Map<String, Set<String>> providers, String service, String text) {
        Set<String> names = providers.computeIfAbsent(service) { new LinkedHashSet<String>() }
        text.readLines().collect { (it.contains('#') ? it.substring(0, it.indexOf('#')) : it).strip() }
                .findAll { !it.isEmpty() }
                .each { names.add(it) }
    }
}

def mergedServiceFilesDirectory = layout.buildDirectory.dir('generated/merged-service-files')
tasks.register('mergedServiceFiles', MergedServiceFiles) {
    description = 'Merges the service files of every runtime library and of the application, for the all-dependencies jar.'
    sources.from(configurations.runtimeClasspath, sourceSets.main.output)
    destination = mergedServiceFilesDirectory
}

task withAllDependendiesJar(type: Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest.from jar.manifest
    archiveClassifier = "all"
    dependsOn 'runtimeVersions', 'thirdPartyLegalFiles', 'mergedServiceFiles'
    from(runtimeVersionsDirectory)
    from(thirdPartyLegalFilesDirectory)
    // before the application's own jar, whose service files are merged into these (#776)
    from(mergedServiceFilesDirectory)
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude "META-INF/*.SF"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.RSA"
        // the jar is no module: it is started with -jar or -cp, and of the module descriptors of the
        // libraries it packs it would keep whichever came first, and say it is that module (#771)
        exclude "module-info.class"
        exclude "META-INF/versions/*/module-info.class"
        // the libraries' licence and notice files stand under META-INF/third-party (#779), not where
        // the first library's would stand for all of them - at the root that was swing-components'
        // LICENSE.txt, an unfilled template, in place of the application's (#773); license-header.txt
        // is a build file of the family's libraries, the licence of nothing in the jar (#777)
        exclude thirdPartyLegalFiles
        exclude "license-header.txt"
        // merged into one file per service, above (#776)
        exclude "META-INF/services/*"
    }
    with jar
}

task createIzPackInstallerFromSignedJar(dependsOn: [clean, withAllDependendiesJar, jar, izPackCreateInstaller]) {
    withAllDependendiesJar.mustRunAfter(clean)
    jar.mustRunAfter(withAllDependendiesJar)
    izPackCreateInstaller.mustRunAfter(jar)
}

task createAllDependendiesJar(dependsOn: [clean, withAllDependendiesJar, jar]) {
    withAllDependendiesJar.mustRunAfter(clean)
    jar.mustRunAfter(withAllDependendiesJar)
}
